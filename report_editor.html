<!-- ===== DYNAMIC SCRIPT LOADER (multi-CDN fallback) ===== -->
<script>
/**
 * Try loading a script from each URL in sequence; resolve on first success.
 * If all fail, resolve anyway (caller checks window global).
 */
function loadScript(urls, globalCheck) {
  return new Promise(resolve => {
    let idx = 0;
    function tryNext() {
      if (idx >= urls.length) { resolve(false); return; }
      const url = urls[idx++];
      const s = document.createElement('script');
      s.src = url;
      s.crossOrigin = 'anonymous';
      s.onload = () => {
        // Some UMD bundles need a tick to set the global
        setTimeout(() => {
          if (!globalCheck || globalCheck()) { resolve(true); }
          else { tryNext(); }           // script loaded but global not set → try next
        }, 30);
      };
      s.onerror = () => { document.head.removeChild(s); tryNext(); };
      document.head.appendChild(s);
    }
    tryNext();
  });
}

// Track readiness
window._libReady = { katex: false, docx: false, fileSaver: false, html2pdf: false };

// KaTeX
loadScript([
  'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
  'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
], () => !!window.katex).then(ok => {
  if (ok) loadScript([
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js',
    'https://unpkg.com/katex@0.16.9/dist/contrib/auto-render.min.js'
  ], () => !!window.renderMathInElement).then(() => {
    window._libReady.katex = true;
    if (window._katexCallback) window._katexCallback();
  });
});

// docx.js — try unpkg first (more reliable UMD build path), then jsDelivr
loadScript([
  'https://unpkg.com/docx@8.5.0/build/index.js',
  'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js',
  'https://unpkg.com/docx@7.8.2/build/index.js',
  'https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js'
], () => !!(window.docx && window.docx.Document)).then(ok => {
  window._libReady.docx = ok;
  updateLibStatus();
});

// FileSaver
loadScript([
  'https://unpkg.com/file-saver@2.0.5/dist/FileSaver.min.js',
  'https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js'
], () => typeof saveAs === 'function').then(ok => {
  window._libReady.fileSaver = ok;
  updateLibStatus();
});

// html2pdf
loadScript([
  'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js',
  'https://unpkg.com/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js'
], () => !!window.html2pdf).then(ok => {
  window._libReady.html2pdf = ok;
  updateLibStatus();
});

function updateLibStatus() {
  const bar = document.getElementById('lib-status');
  if (!bar) return;
  const allReady = window._libReady.docx && window._libReady.fileSaver;
  if (allReady) {
    bar.style.display = 'none';
  } else {
    const parts = [];
    if (!window._libReady.docx) parts.push('docx.js');
    if (!window._libReady.fileSaver) parts.push('FileSaver');
    bar.textContent = '⏳ 正在加载库：' + parts.join('、') + '…';
  }
}
</script>

<script>
/* ============================================================
   CONTENT DATA
   每条记录 type:
     'h0'      – 摘要标题（与h1同级但无章号）
     'h1'      – 第X章
     'h2'      – X.Y
     'h3'      – X.Y.Z

     'formula' – 独立公式块 { latex, num }
     'ref'     – 参考文献条目（数组）
   ============================================================ */
const CONTENT = [

// ── 摘要 ──────────────────────────────────────────────────────
{type:'h0', text:'摘  要'},
{type:'para', text:'本文研究了多机器人系统在障碍物密集环境中进行编队导航的最优运动规划问题。针对多机器人系统在保持预定编队的同时安全穿越复杂障碍环境这一核心挑战，我们提出了一套完整的分层操作框架，涵盖从全局规划到局部规划、从外部避障到内部避障的全过程。首先，采用增强型A*算法进行全局路径规划，通过引入基于障碍物距离的安全权重因子，使规划路径远离障碍物边界，提升行驶安全性。其次，提出基于局部自由空间（Local Free Space）的新型优化框架，将编队维持问题转化为线性约束优化问题，利用形状理论（Shape Theory）建立编队形状约束，并设计了基于投影的迭代算法求解最优目标位置。对于机器人间的碰撞避免，引入互反速度障碍（Reciprocal Velocity Obstacles，RVO）方法实现局部运动协调。仿真实验验证了所提方法在复杂环境中实现无碰撞、保编队导航的有效性，算法在每步优化平均耗时 12 毫秒的条件下成功引导机器人通过多个狭窄通道。'},
{type:'kw', text:'关键词：多机器人系统；最优编队；路径规划；分层避障；局部自由空间；形状理论'},

// ── 第一章 引言 ────────────────────────────────────────────────
{type:'h1', text:'第一章  引  言'},
{type:'h2', text:'1.1  研究背景与意义'},
{type:'para', text:'多机器人系统（Multirobot Systems，MRSs）在物流、运输、搜索与救援等领域中的应用日益广泛，协作行为能够显著提升系统的效率、鲁棒性和可扩展性。其中一个核心挑战是：如何使机器人在保持编队的同时，安全地在复杂环境中协作导航。无碰撞路径规划因此成为研究的核心问题，要求方法能够集成全局导航、局部避障与编队保持三大功能。'},
{type:'para', text:'在上述领域，A*算法被广泛用于全局规划，但其生成的路径往往靠近障碍物[1][2]。为此，文献[3]提出了一种增强变体，通过对靠近障碍物的路径施加惩罚，提升安全性与效率。在局部避障方面，基于Voronoi图的方法因能大幅提升导航安全性与效率而受到广泛关注[4][5][6]。此外，功率图（Power Diagram）方法通过定义凸无碰撞区域和连续向量场，实现了机器人的精确反应式导航[7]。'},
{type:'para', text:'然而，这些方法大多只关注几何结构，并未同时解决避障与编队维持的双重挑战。在编队维持方面，形状理论（Shape Theory）[9]是一种常用策略，而基于速度障碍的方法（如RVO）则为多机器人内部碰撞避免提供了有效手段[12][13]。本文在上述研究基础上，提出了一个统一的框架，将路径规划与编队保持联合处理，并构建了内外分层的障碍物避免体系。'},

{type:'h2', text:'1.2  国内外研究现状'},
{type:'para', text:'在多机器人路径规划领域，A*算法及其变体是全局规划的主流方法。文献[1][2]分别在不同应用场景下验证了A*算法的有效性。文献[3]提出的安全增强型A*在路径生成时引入安全代价，使路径自动远离障碍物边界。'},
{type:'para', text:'基于Voronoi结构的方法在导航安全性提升方面取得了显著进展。文献[4]的Voronoi图碰撞自由A*算法利用Voronoi拓扑实现动态障碍物周围的自适应重规划；文献[5]将加权Voronoi图与改进A*融合，优先选择高间距短路径；文献[6]的Clean GVD通过裁剪冗余边生成紧凑拓扑图，提升路径计算效率。文献[7]的功率图方法定义凸无碰撞区域，生成连续向量场引导机器人安全到达目标。'},
{type:'para', text:'在编队控制方面，文献[9]提出的基于形状理论的分布式优化方法为多机器人编队维持提供了数学框架。文献[10]研究了具有形状理论的最优编队与最优匹配算法，文献[11]则利用拉普拉斯矩阵的分布式优化解决了类似问题，但两者均未考虑障碍物环境下的编队导航。在局部避碰方面，V-RVO框架[12]将缓冲Voronoi单元与RVO锥结合，用于密集多机器人避碰；改进混合RVO[13]在无通信条件下适应运动学约束；情感RVO[14]和优先级RVO[15]方法分别改善了领航—跟随行为中的代理间距离和优先级调度。'},

{type:'h2', text:'1.3  本文主要贡献'},
{type:'para', text:'本文的主要贡献在于提出了一个联合处理路径规划与编队维持的新型框架。通过引入局部自由空间（Local Free Space）的概念，将最优编队算法的应用从空旷空间中的编队形成扩展到障碍物密集空间中的导航与编队保持。'},
{type:'para', text:'另一主要贡献是构建了内外分层的障碍物避免体系：在外层，采用局部自由空间方法处理机器人与外部障碍物之间的碰撞；在内层，引入RVO方法防止机器人之间的相互碰撞。这种分层设计在保证完整避障的同时显著降低了算法复杂度。此外，本文针对所提优化问题设计了基于投影的迭代算法，并在一定步长条件下严格证明了算法的全局收敛性。'},

// ── 第二章 问题描述 ────────────────────────────────────────────
{type:'h1', text:'第二章  问题描述'},
{type:'h2', text:'2.1  系统模型'},
{type:'para', text:'本文考虑一个封闭工作空间，其中包含圆盘形障碍物 $\\mathcal{W}$。设障碍物数量为 $m$，机器人数量为 $n$。第 $j$ 个障碍物（$1\\le j\\le m$）的圆心记为 $O_j$，半径为 $R_j$。第 $i$ 个圆盘形机器人（$1\\le i\\le n$）的圆心记为 $p_i$，半径为 $r_i$，机器人最大半径定义为 $r_m=\\max_{1\\le i\\le n}r_i$。编队中心记为 $p_c$。'},
{type:'para', text:'为防止编队离开工作空间，参考文献[7]将有效工作空间改进定义为：'},
{type:'formula', latex:'\\widetilde{\\mathcal{W}}=\\{q\\in\\mathcal{W}\\mid B(q,r_m)\\in\\mathcal{W}\\}', num:'(3)'},
{type:'para', text:'为简便起见，后文中 $\\mathcal{W}$ 均指代 $\\widetilde{\\mathcal{W}}$。为防止碰撞，将机器人的局部自由空间 $\\mathcal{LF}(x)$ 定义为：'},
{type:'formula', latex:'\\mathcal{LF}(x)=\\left\\{q\\in\\mathcal{W}\\;\\middle|\\;q\\in\\bigcap_{i=1}^{N}H_i(x)\\right\\}', num:'(4)'},
{type:'para', text:'其中 $H_i$ 为由机器人编队中心 $p_c$ 与障碍物 $O_i$ 构成的半平面：'},
{type:'formula', latex:'H_i(x)=\\left\\{q\\in\\mathcal{W}\\;\\middle|\\;(q-p_c)^{\\top}d_i\\le c_i\\right\\}', num:'(5)'},
{type:'para', text:'其中 $d_i=\\dfrac{O_i-p_c}{\\|O_i-p_c\\|}$，$c_i=\\|d_i\\|-(R_i+r_m)$。此外，局部自由空间的概念被扩展到凸多边形障碍物，通过选取最近边的单位法向量 $v_k$ 定义对应半平面 $H_k$，从而得到完整的局部自由空间：'},
{type:'formula', latex:'\\mathcal{LF}=\\left\\{q\\in\\mathcal{W}\\;\\middle|\\;q\\in\\bigcap_{i=1}^{N_{\\mathrm{disk}}}H_{\\mathrm{disk},i}\\cap\\bigcap_{k=1}^{N_{\\mathrm{poly}}}H_{\\mathrm{poly},k}\\right\\}', num:'(7)'},
{type:'para', text:'由于 $\\mathcal{LF}$ 是多个半平面（凸集）的交集，因此 $\\mathcal{LF}$ 本身也是凸集。$\\mathcal{LF}$ 与障碍物之间存在安全裕度，保证机器人在 $\\mathcal{LF}$ 内运动时不会与障碍物发生碰撞。'},

{type:'h2', text:'2.2  优化问题建立'},
{type:'para', text:'本文研究如何使多机器人系统在保持与给定编队相同形状的条件下，最优地移动到目标位置。编队形状由 $n$ 个点 $s_1,s_2,\\ldots,s_n$（$s_i\\in\\mathbb{R}^2$）定义。全局路径规划提供一系列虚拟目标 $T_1,T_2,\\ldots,T_l$ 以及真实目标 $T_0$，引导机器人系统沿A*生成的路径运动。'},
{type:'para', text:'由于每个机器人的运动需保持在局部自由空间 $\\mathcal{LF}$ 内，需要确定中间路点 $q_k$ 使得下一组目标位置完全位于 $\\mathcal{LF}$ 内。路点选择问题被形式化为如下优化问题：'},
{type:'formula', latex:'\\min_{Q}\\;\\sum_{i=1}^{n}\\left[\\frac{\\lambda}{2}\\|q_i-T_i\\|^2+(1-\\lambda)\\|q_i-T_i\\|_1\\right]\\qquad\\text{s.t.}\\;Q\\in[S],\\;q_i\\in\\mathcal{LF}', num:'(8)'},
{type:'para', text:'其中 $\\lambda\\in[0,1]$ 为权重系数，$q_i\\in\\mathbb{R}^2$ 为机器人 $i$ 的目标位置，$Q=(q_1,q_2,\\ldots,q_n)\\in\\mathbb{R}^{2\\times n}$ 为目标编队矩阵，$S$ 为参考编队，$T$ 为当前目标。利用形状理论[9]将 $Q\\in[S]$ 转化为线性等式约束 $Aq=0$，优化问题等价改写为：'},
{type:'formula', latex:'\\min_{q}\\;\\frac{\\lambda}{2}\\|q-T\\|^2+(1-\\lambda)\\|q-T\\|_1\\qquad\\text{s.t.}\\;Aq=0,\\;q\\in\\mathcal{LF}^n', num:'(9)'},

// ── 第三章 全局路径规划 ───────────────────────────────────────
{type:'h1', text:'第三章  全局路径规划'},
{type:'h2', text:'3.1  经典A*算法'},
{type:'para', text:'A*算法[16]是全局路径规划的经典方法，其代价函数由以下核心公式定义：'},
{type:'formula', latex:'f(n)=g(n)+h(n),\\quad g(n)=g(n-1)+d_{n-1\\to n}', num:'(1)'},
{type:'para', text:'其中 $g(n)$ 为从起始节点到当前节点 $n$ 的实际代价，$h(n)$ 为从节点 $n$ 到目标的估计代价（启发函数），$f(n)$ 为经过节点 $n$ 的路径总估计代价。项 $d_{n-1\\to n}$ 对应从前一节点 $n-1$ 到当前节点 $n$ 的欧几里得距离，构成基本几何代价。'},

{type:'h2', text:'3.2  增强型A*算法'},
{type:'para', text:'在标准A*算法的基础上，本文集成了安全感知的代价计算机制，通过引入权重因子 $W$ 对运动代价进行修正：'},
{type:'formula', latex:'g(n)=g(n-1)+W\\cdot d_{n-1\\to n},\\quad W=1+\\dfrac{1}{d_{\\min}+\\varepsilon}', num:'(2)'},
{type:'para', text:'其中 $d_{\\min}$ 表示到障碍物或环境边界的最小允许距离，$\\varepsilon$ 为避免除零的小常数。通过这种加权公式，靠近障碍物或边界的路径会受到惩罚，从而生成具有更大安全裕度的轨迹，提升整体安全性。增强型A*算法在预定义的环境地图内进行搜索，生成从起始点 $B$ 到目标点 $T_0$ 的全局最优路径 $P=\\{B,T_1,T_2,\\ldots,T_k,T_0\\}$，每个机器人按顺序通过这些路点，最终到达指定目标位置。'},

// ── 第四章 局部路径规划 ───────────────────────────────────────
{type:'h1', text:'第四章  局部路径规划'},
{type:'h2', text:'4.1  局部自由空间'},
{type:'para', text:'局部自由空间 $\\mathcal{LF}$ 是本文局部路径规划的核心概念，其定义与性质已在第二章问题描述中给出。对于圆盘形障碍物，半平面 $H_i$ 的法向量指向从编队中心 $p_c$ 到障碍物圆心 $O_i$ 的方向，截距 $c_i$ 由机器人到障碍物的净距离确定，保证了在 $\\mathcal{LF}$ 内运动时与障碍物的最小间距。'},
{type:'para', text:'对于凸多边形障碍物，局部自由空间通过选取最近边的单位法向量 $v_k$ 构造对应半平面 $H_k$，其中 $c_k=d_{\\text{Edge},k}-r_m$，$d_{\\text{Edge},k}$ 为 $p_c$ 到该边的欧几里得距离。由于 $\\mathcal{LF}$ 是多个半平面的交集，因此 $\\mathcal{LF}$ 本身也是凸集，机器人在 $\\mathcal{LF}$ 内运动时不会与障碍物发生碰撞。'},

{type:'h2', text:'4.2  基于局部自由空间的最优编队算法'},
{type:'para', text:'本节描述求解第二章中优化问题（9）的算法。由引理2（参见文献[17]），优化问题的最优解 $q^*$ 的充要条件为：存在 $y^*\\in\\mathbb{R}^l$ 和 $z^*\\in\\mathbb{R}^{2n}$，使得 $(q^*,y^*,z^*)$ 满足：'},
{type:'formula', latex:'\\begin{cases}q^*=\\varphi\\bigl(q^*-\\sigma[\\lambda(q^*-p)+(1-\\lambda)z^*+A^{\\top}y^*]\\bigr)\\\\Aq^*=0\\\\z^*=\\psi(z^*+q^*-p)\\end{cases}', num:'(10)'},
{type:'para', text:'其中 $\\sigma$ 为正常数，$\\varphi:\\mathbb{R}^{2n}\\to\\mathcal{LF}^n$ 与 $\\psi:\\mathbb{R}^{2n}\\to[-1,1]^{2n}$ 为投影算子。基于此最优性条件，本文给出以下迭代算法：'},
{type:'formula', latex:'\\begin{cases}q_{k+1}=\\varphi\\bigl(q_k-\\sigma[\\lambda(q_k-p)+(1-\\lambda)\\psi(z_k+q_k-p)+A^{\\top}(y_k+Aq_k)]\\bigr)\\\\y_{k+1}=y_k+Aq_{k+1}\\\\z_{k+1}=\\psi(z_k+q_{k+1}-p)\\end{cases}', num:'(11)'},
{type:'para', text:'其中下标 $k$ 表示迭代次数，$y_k$ 为关于约束 $Aq=0$ 的拉格朗日乘子；$z_k$ 为L1范数的次梯度辅助变量，用于处理不可微的L1范数项。'},

// ── 第五章 编队算法 ───────────────────────────────────────────
{type:'h1', text:'第五章  编队算法'},
{type:'h2', text:'5.1  形状理论（Shape Theory）'},
{type:'para', text:'形状理论是本文编队维持约束的数学基础。给定参考编队 $S=(s_1,s_2,\\ldots,s_n)\\in\\mathbb{R}^{2\\times n}$，编队形状等价类 $[S]$ 表示所有与 $S$ 具有相同形状的编队集合——即可以通过旋转、缩放和平移从 $S$ 得到的编队。'},
{type:'para', text:'设 $s_1=(0,0)$，则对于形状等价类中的编队 $Q$，有 $p_i-p_1=cRs_i$，其中 $c>0$ 为缩放因子，$R\\in\\mathrm{SO}(2)$ 为旋转矩阵。将 $p_i$ 和 $s_i$ 视为复数，则有 $s_2\\cdot(p_i-p_1)=s_i\\cdot(p_2-p_1)$，写成矩阵形式 $M_2(p_i-p_1)=M_i(p_2-p_1)$，整理后得 $(M_i-M_2)p_1-M_ip_2+M_2p_i=0$，其中 $M_i=\\bigl[\\begin{smallmatrix}s_{i,x}&-s_{i,y}\\\\s_{i,y}&s_{i,x}\\end{smallmatrix}\\bigr]$。汇总所有机器人的约束，得到编队形状等式约束矩阵 $A$，满足 $Aq=0$。'},

{type:'h2', text:'5.2  最优编队算法描述'},
{type:'para', text:'结合全局路径规划、局部自由空间和编队形状约束，完整的最优编队导航算法如下：初始化阶段设定起始点 $B$、目标点 $T_0$、参考编队形状 $S$ 和步长 $\\sigma$，计算编队约束矩阵 $A$，通过增强型A*算法初始化全局路径 $P$。迭代阶段中，当前位置未到达 $T_0$ 时循环执行：通过迭代公式(11)计算最优路点 $Q^*$，若到达当前目标则更新目标，否则在路径中插入 $Q^*$；最终返回更新后的完整路径 $\\tilde{P}$。在获得最优解后，机器人利用RVO算法向目标位置移动，实现内部碰撞避免。'},

// ── 第六章 内部障碍物避免 ─────────────────────────────────────
{type:'h1', text:'第六章  内部障碍物避免'},
{type:'h2', text:'6.1  互反速度障碍（RVO）方法'},
{type:'para', text:'在多机器人编队控制中，机器人间的碰撞避免至关重要。本文采用文献[18]所描述的RVO方法实现内部碰撞避免。对于速度分别为 $v_i(t)$ 和 $v_j(t)$ 的机器人 $i$ 和 $j$，机器人 $j$ 对机器人 $i$ 施加的RVO定义为：'},
{type:'formula', latex:'\\mathrm{RVO}_{ij}\\bigl(v_j(t),v_i(t)\\bigr)=\\bigl\\{v_i\'(t)\\mid 2v_i\'(t)-v_i(t)\\in\\mathrm{VO}_{ij}(v_j(t))\\bigr\\}'},
{type:'para', text:'其中 $\\mathrm{VO}_{ij}(v_j(t))$ 表示在假设 $v_j(t)$ 保持不变的条件下，机器人 $i$ 会与 $j$ 发生碰撞的速度集合。RVO 集合内的速度是当前速度与VO推导速度之间的加权平均，确保互反式碰撞避免。'},

{type:'h2', text:'6.2  速度选择策略'},
{type:'para', text:'在多机器人系统中，每个机器人首先计算其期望速度 $v_{\\mathrm{pref},i}(t)$，并检查是否与其他机器人的RVO集合发生冲突。若存在冲突，通过求解优化问题选取避开所有RVO集合、同时与期望速度偏差最小的速度：'},
{type:'formula', latex:'v_i(t)=\\mathop{\\arg\\min}_{v\\in G_i(t)\\setminus O_i(t)}\\bigl\\|v-v_{\\mathrm{pref},i}(t)\\bigr\\|'},
{type:'para', text:'其中 $G_i(t)$ 为满足运动学约束的可达速度集合，$O_i(t)$ 为来自其他机器人和静态障碍物的所有速度障碍的并集。若完全无碰撞速度不存在（$G_i(t)\\setminus O_i(t)=\\emptyset$），则以碰撞时间 $t_i^{\\mathrm{col}}(v,t)$ 作为惩罚项，选取次优速度：'},
{type:'formula', latex:'v_i(t)=\\mathop{\\arg\\min}_{v\\in G_i(t)}\\left[\\frac{\\beta}{t_i^{\\mathrm{col}}(v,t)}+\\bigl\\|v-v_{\\mathrm{pref},i}(t)\\bigr\\|\\right]'},
{type:'para', text:'其中 $\\beta>0$ 为平衡安全性与轨迹跟踪性能的参数。通过外层局部自由空间与内层RVO方法的协同作用，整个系统构成了一套完整的分层障碍物避免机制。'},

// ── 第七章 收敛性分析 ─────────────────────────────────────────
{type:'h1', text:'第七章  收敛性分析'},
{type:'h2', text:'7.1  收敛定理'},
{type:'para', text:'本节证明所提迭代算法的全局收敛性。'},
{type:'para', text:'定理1：对于任意初始条件 $(q_0,y_0,z_0)$，投影迭代算法生成的序列 $\\{q_k\\}$ 全局收敛到编队优化问题的最优解 $q^*$，前提是步长参数 $\\sigma$ 满足：'},
{type:'formula', latex:'\\sigma<\\dfrac{1}{2+\\lambda_{\\max}(A^{\\top}A)}', num:''},
{type:'para', text:'其中 $\\lambda_{\\max}(\\cdot)$ 表示矩阵的最大特征值，$A$ 为由编队约束构造的满行秩矩阵。'},

{type:'h2', text:'7.2  收敛性证明'},
{type:'para', text:'收敛性证明遵循文献[10]中建立的方法论。构造如下李雅普诺夫候选函数：'},
{type:'formula', latex:'V(q_k,y_k,z_k)=\\|q_k-q^*\\|^2+\\sigma\\bigl(\\|y_k-y^*\\|^2+(1-\\lambda)\\|z_k-z^*\\|^2\\bigr)'},
{type:'para', text:'通过分析各更新规则，可以建立以下三组关键不等式：（1）$V_1(q_k)=\\frac{1}{2}\\|q_k-q^*\\|^2$ 的增量满足非增条件；（2）对偶变量更新给出辅助估计；（3）次梯度项的变化满足对应不等式。综合以上不等式，可得总李雅普诺夫函数 $V(q_k,y_k,z_k)$ 沿系统轨迹单调不增。根据离散时间系统的LaSalle不变性原理，可以严格确立算法的全局收敛性，与文献[10]中的证明方法类似。'},

// ── 第八章 仿真结果 ───────────────────────────────────────────
{type:'h1', text:'第八章  仿真结果'},
{type:'h2', text:'8.1  仿真设置'},
{type:'para', text:'仿真实验在 $[0,20]\\times[0,20]$ 的平面工作空间中进行，工作空间内分布有若干静态圆盘形障碍物。部署4个同质机器人（$n=4$），初始状态为正方形编队，虚拟参考中心 $q_c$ 位于原点。本文提出的算法与采用固定编队几何形状的基础A*规划器进行对比。机器人群体依照算法1所描述的流程执行导航任务。'},

{type:'h2', text:'8.2  导航仿真结果（Python）'},
{type:'para', text:'图1展示了在约束环境中的成功导航过程。所有机器人在45秒内到达目标位置，同时在障碍物密集环境中保持了碰撞避免。算法以一致的安全裕度0.3成功导航通过五个狭窄通道，保持了较高的计算效率（平均每步优化耗时12毫秒）。'},
{type:'para', text:'机器人轨迹清晰展示了在保持编队完整性的同时实现有效导航的效果。自适应安全区域 $\\mathcal{LF}(x)$（图中绿色多边形）通过根据障碍物距离约束编队运动，实现了安全通过狭窄通道。路径由A*算法生成的12个路点构成，必要时将目标位置投影到 $\\mathcal{LF}(x)$ 上。'},

{type:'h2', text:'8.3  收敛性验证'},
{type:'para', text:'图2展示了全面的收敛性分析结果。左图验证了严格的编队约束满足情况（$Aq=b$），残差范数快速下降至机器精度阈值（$10^{-14}$），确保了几何完整性，大多数路点在20次迭代内收敛。右图通过绘制迭代更新范数 $\\|q_k-\\varphi(q_k-\\sigma(\\lambda(q_k-p)+(1-\\lambda)z_k+A^{\\top}y_k))\\|$ 并验证其趋近于0，证明了优化函数达到了最小值。'},

// ── 第九章 总结 ───────────────────────────────────────────────
{type:'h1', text:'第九章  总  结'},
{type:'para', text:'本文针对多机器人系统在障碍物密集环境中的编队导航问题，提出了一套完整的分层操作框架。主要工作如下：'},

/* ============================================================
   RENDER CONTENT
   ============================================================ */
function renderContent() {
  const container = document.getElementById('doc-content');
  let html = '';

  for (const item of CONTENT) {
    switch(item.type) {
      case 'h0':
        html += `<div class="dh1" contenteditable="true">${esc(item.text)}</div>`;
        break;
      case 'h1':
        html += `<div class="dh1" contenteditable="true">${esc(item.text)}</div>`;
        break;
      case 'h2':
        html += `<div class="dh2" contenteditable="true">${esc(item.text)}</div>`;
        break;
      case 'h3':
        html += `<div class="dh3" contenteditable="true">${esc(item.text)}</div>`;
        break;
      case 'para':
        html += `<div class="dp" contenteditable="true">${esc(item.text)}</div>`;
        break;
      case 'kw':
        html += `<div class="dkw" contenteditable="true">${esc(item.text)}</div>`;
        break;
      case 'formula': {
        const num = item.num || '';
        html += `<div class="df-wrap">
          <div class="df-inner" data-latex="${escAttr(item.latex)}">
            <span class="math-block">\\[${item.latex}\\]</span>
          </div>
          ${num ? `<span class="df-num">${esc(num)}</span>` : ''}
        </div>`;
        break;
      }
      case 'refs':
        for (const ref of item.items) {
          html += `<div class="dref" contenteditable="true">${esc(ref)}</div>`;
        }
        break;
    }
  }

  container.innerHTML = html;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return s.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function applyStyles() {
  const pg = document.getElementById('document-page');
  const set = (k,v) => pg.style.setProperty(k, v);

  set('--body-font',  document.getElementById('s-bfont').value);
  set('--body-size',  document.getElementById('s-bsize').value);
  set('--body-lh',    document.getElementById('s-blh').value);
  set('--h1-font',    document.getElementById('s-h1font').value);
  set('--h1-size',    document.getElementById('s-h1size').value);
  set('--h1-align',   document.getElementById('s-h1align').value);
  set('--h2-font',    document.getElementById('s-h2font').value);
  set('--h2-size',    document.getElementById('s-h2size').value);
  set('--h2-align',   document.getElementById('s-h2align').value);
  set('--h3-size',    document.getElementById('s-h3size').value);
  set('--h3-align',   document.getElementById('s-h3align').value);

function loadTemplate(el) {
  document.querySelectorAll('.tpl').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
  const t = TEMPLATES[el.dataset.tpl];
  if (!t) return;
  setSelect('s-bfont',  t.bfont);
  setSelect('s-bsize',  t.bsize);
  setSelect('s-blh',    t.blh);
  setSelect('s-h1font', t.h1font);
  setSelect('s-h1size', t.h1size);
  setSelect('s-h1align',t.h1align);
  setSelect('s-h2font', t.h2font);
  setSelect('s-h2size', t.h2size);
  setSelect('s-h2align',t.h2align);
  setSelect('s-h3size', t.h3size);
  setSelect('s-h3align',t.h3align);
  applyStyles();
}

function setSelect(id, val) {
  const el = document.getElementById(id);
  for (const opt of el.options) {
    if (opt.value === val) { el.value = val; return; }
  }
  // If exact match not found, add and select
  const opt = document.createElement('option');
  opt.value = val; opt.textContent = val;
  el.appendChild(opt);
  el.value = val;
}

let notifTimer = null;
function notify(msg, duration=2500) {
  const el = document.getElementById('notif');
  el.textContent = msg;

  notifTimer = setTimeout(()=>el.classList.remove('show'), duration);
}

/* ============================================================
   DOCX EXPORT  –  uses docx.js with Math equation objects
   Formulas are rendered as proper Word equation (OMML) objects
   via docx.js Math API
   ============================================================ */
async function exportToDocx() {
  notify('⏳ 正在生成 DOCX（含Word公式）…', 12000);
  await new Promise(r=>setTimeout(r, 50));

  // ── wait up to 15 s for docx.js and FileSaver to load ──
  const waitLib = (check, label, ms=15000) => new Promise((res, rej) => {
    if (check()) { res(); return; }
    const start = Date.now();
    const t = setInterval(() => {
      if (check()) { clearInterval(t); res(); }
      else if (Date.now()-start > ms) {
        clearInterval(t);
        rej(new Error(`${label} 加载超时，请检查网络连接后刷新页面重试`));
      }
    }, 200);
  });

  try {
    await waitLib(
      () => !!(window.docx && window.docx.Document),
      'docx.js'
    );
    await waitLib(
      () => typeof saveAs === 'function',
      'FileSaver'
    );
  } catch(waitErr) {
    notify('❌ ' + waitErr.message, 8000);
    return;
  }

  try {
    const D = window.docx;

    // ── current style settings ──
    const bodyFontName = getDocxFontName(document.getElementById('s-bfont').value);
    const bodySize     = ptToHalfPt(document.getElementById('s-bsize').value);
    const bodyLh       = parseFloat(document.getElementById('s-blh').value);
    const h1FontName   = getDocxFontName(document.getElementById('s-h1font').value);
    const h1Size       = ptToHalfPt(document.getElementById('s-h1size').value);
    const h1Align      = document.getElementById('s-h1align').value === 'center'
                           ? D.AlignmentType.CENTER : D.AlignmentType.LEFT;
    const h2FontName   = getDocxFontName(document.getElementById('s-h2font').value);
    const h2Size       = ptToHalfPt(document.getElementById('s-h2size').value);
    const h2Align      = document.getElementById('s-h2align').value === 'center'
                           ? D.AlignmentType.CENTER : D.AlignmentType.LEFT;

    // Line spacing in twips (1pt = 20 twips)
    const bodyLhTwips  = Math.round(bodyLh * bodySize/2 * 20);

    function bodyPPr(indent2em) {
      return {
        spacing: { line: bodyLhTwips, lineRule: D.LineRuleType ? D.LineRuleType.AUTO : 'auto' },
        indent: indent2em ? { firstLine: bodySize * 20 } : undefined
      };
    }

    // ── paragraph factories ──
    function mkPara(text) {
      return new D.Paragraph({
        children: [new D.TextRun({ text, font: bodyFontName, size: bodySize })],
        spacing: { line: bodyLhTwips },
        indent: { firstLine: bodySize * 20 }
      });
    }

    function mkH1(text, breakPage = false) {
      return new D.Paragraph({
        children: [new D.TextRun({ text, font: h1FontName, size: h1Size, bold: true })],
        alignment: h1Align,
        spacing: { before: 480, after: 240 },
        ...(breakPage ? { pageBreakBefore: true } : {})
      });
    }

    function mkH2(text) {
      return new D.Paragraph({
        children: [new D.TextRun({ text, font: h2FontName, size: h2Size, bold: true })],
        alignment: h2Align,
        spacing: { before: 280, after: 120 }
      });
    }

    function mkRef(text) {
      return new D.Paragraph({
        children: [new D.TextRun({ text, font: bodyFontName, size: bodySize })],
        spacing: { line: bodyLhTwips },
        indent: { left: bodySize * 20, hanging: bodySize * 20 }
      });
    }

    // ── LaTeX → OMML conversion via KaTeX MathML ──────────────

    /**
     * Recursively convert a MathML DOM node to an array of docx OMML elements.
     */
    function mathmlNodeToOmml(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        const text = node.textContent;
        if (!text.trim()) return [];
        return [new D.MathRun(text)];
      }
      if (node.nodeType !== Node.ELEMENT_NODE) return [];

      // Strip namespace prefix (e.g. "m:mrow" → "mrow")
      const tag = node.tagName.toLowerCase().replace(/^[a-z0-9]+:/, '');

      const childOmml = (el) => {
        const out = [];
        for (const c of el.childNodes) out.push(...mathmlNodeToOmml(c));
        return out;
      };
      const nth = (n) => node.children[n] ? childOmml(node.children[n]) : [];

      switch (tag) {
        case 'math':
        case 'mrow':
        case 'mstyle':
        case 'mpadded':
        case 'merror':
        case 'mphantom':
        case 'mfenced':
          return childOmml(node);

        case 'semantics':
          // Only process the first child (skip <annotation>)
          return node.children[0] ? childOmml(node.children[0]) : [];

        case 'annotation':
        case 'annotation-xml':
          return [];

        case 'mi':
        case 'mn':
        case 'mo':
        case 'mtext':
          return node.textContent ? [new D.MathRun(node.textContent)] : [];

        case 'mspace':
          return [new D.MathRun('\u00a0')];

        case 'mfrac':
          return [new D.MathFraction({ numerator: nth(0), denominator: nth(1) })];

        case 'msqrt':
          try { return [new D.MathRadical({ children: childOmml(node) })] }
          catch(e) { return [new D.MathRun('√('), ...childOmml(node), new D.MathRun(')')]; }

        case 'mroot':
          try { return [new D.MathRadical({ children: nth(0), degree: nth(1) })]; }
          catch(e) { return [...nth(1), new D.MathRun('√('), ...nth(0), new D.MathRun(')')]; }

        case 'msub':
          return [new D.MathSubScript({ children: nth(0), subScript: nth(1) })];

        case 'msup':
          return [new D.MathSuperScript({ children: nth(0), superScript: nth(1) })];

        case 'msubsup':
          return [new D.MathSubSuperScript({ children: nth(0), subScript: nth(1), superScript: nth(2) })];

        case 'mover':
          // Treat as superscript (covers \hat, \widetilde, limits etc.)
          return [new D.MathSuperScript({ children: nth(0), superScript: nth(1) })];

        case 'munder':
          return [new D.MathSubScript({ children: nth(0), subScript: nth(1) })];

        case 'munderover':
          return [new D.MathSubSuperScript({ children: nth(0), subScript: nth(1), superScript: nth(2) })];

        case 'mtable': {
          // Flatten table rows (covers \begin{cases}, \begin{pmatrix}, etc.)
          const rows = Array.from(node.children).map(tr => childOmml(tr));
          const out = [];
          rows.forEach((r, i) => { if (i > 0) out.push(new D.MathRun(';  ')); out.push(...r); });
          return out;
        }

        case 'mtr':
        case 'mtd':
        case 'mlabeledtr':
        case 'menclose':
        case 'mmultiscripts':
        default:
          return childOmml(node);
      }
    }

    /**
     * Convert a LaTeX string to an array of docx OMML math elements.
     * Uses KaTeX for reliable parsing; falls back to a plain MathRun if KaTeX is unavailable.
     */
    function latexToOmml(latex) {
      try {
        if (!window.katex) return [new D.MathRun(latex)];
        const html = katex.renderToString(latex, { output: 'mathml', throwOnError: false });
        const div = document.createElement('div');
        div.innerHTML = html;
        const mathEl = div.querySelector('math');
        if (!mathEl) return [new D.MathRun(latex)];
        return mathmlNodeToOmml(mathEl);
      } catch(e) {
        console.warn('latexToOmml failed:', latex, e);
        return [new D.MathRun(latex)];
      }
    }

    function mathPara(mathChildren, num) {
      const children = [new D.Math({ children: mathChildren })];
      if (num) {
        children.push(new D.TextRun({ text: '      ' + num, font: bodyFontName, size: bodySize }));
      }
      return new D.Paragraph({
        children,
        alignment: D.AlignmentType.CENTER,
        spacing: { before: 180, after: 180 }
      });
    }

    /** Build a centred display-math paragraph from a LaTeX string. */
    function buildMathForLatex(latex, num) {
      return mathPara(latexToOmml(latex), num);
    }

    /**
     * Split a paragraph text string into alternating plain-text / inline-math segments.
     * Handles $$...$$ (display, treated as inline) and $...$ markers.
     */
    function parseMathSegments(text) {
      const segs = [];
      let i = 0;
      while (i < text.length) {
        if (text[i] === '$' && text[i + 1] === '$') {
          const end = text.indexOf('$$', i + 2);
          if (end !== -1) { segs.push({ math: true, s: text.slice(i + 2, end) }); i = end + 2; continue; }
        }
        if (text[i] === '$') {
          const end = text.indexOf('$', i + 1);
          if (end !== -1) { segs.push({ math: true, s: text.slice(i + 1, end) }); i = end + 1; continue; }
        }
        const next$ = text.indexOf('$', i);
        const chunk = next$ === -1 ? text.slice(i) : text.slice(i, next$);
        if (chunk) segs.push({ math: false, s: chunk });
        if (next$ === -1) break;
        i = next$;
      }
      return segs;
    }

    /**
     * Build a body paragraph whose text may contain inline LaTeX ($...$).
     * Math spans are converted to Word OMML; plain text becomes TextRun.
     */
    function mkParaWithMath(text) {
      const segs = parseMathSegments(text);
      const children = [];
      for (const seg of segs) {
        if (seg.math) {
          const omml = latexToOmml(seg.s);
          if (omml.length) children.push(new D.Math({ children: omml }));
        } else {
          if (seg.s) children.push(new D.TextRun({ text: seg.s, font: bodyFontName, size: bodySize }));
        }
      }
      return new D.Paragraph({
        children,
        spacing: { line: bodyLhTwips },
        indent: { firstLine: bodySize * 20 }
      });
    }

    // ── traverse DOM to build docx children ──
    const docChildren = [];

    // Cover / title page header
    docChildren.push(new D.Paragraph({
      children: [new D.TextRun({ text: '东南大学本科生创新训练计划项目', font: bodyFontName, size: bodySize })],
      alignment: D.AlignmentType.CENTER,
      spacing: { before: 0, after: 480 }
    }));
    docChildren.push(new D.Paragraph({
      children: [new D.TextRun({ text: '结  题  报  告', font: h1FontName, size: h1Size * 2, bold: true })],
      alignment: D.AlignmentType.CENTER,
      spacing: { after: 480 }
    }));
    docChildren.push(new D.Paragraph({
      children: [new D.TextRun({ text: '项目名称：多机器人系统最优编队导航研究', font: bodyFontName, size: bodySize })],
      spacing: { after: 120 }
    }));
    docChildren.push(new D.Paragraph({
      children: [new D.TextRun({ text: '所属学院：数学学院', font: bodyFontName, size: bodySize })],
      spacing: { after: 120 }
    }));
    docChildren.push(new D.Paragraph({
      children: [new D.TextRun({ text: '指导教师：刘庆山', font: bodyFontName, size: bodySize })],
      spacing: { after: 480 }
    }));

    // Content paragraphs
    for (const item of CONTENT) {
      switch(item.type) {
        case 'h0':
          docChildren.push(new D.Paragraph({
            children: [new D.TextRun({ text: item.text, font: h1FontName, size: h1Size, bold: true })],
            alignment: D.AlignmentType.CENTER,
            spacing: { before: 480, after: 240 }
          }));
          break;
        case 'h1':
          docChildren.push(mkH1(item.text, item.text === '参考文献'));
          break;
        case 'h2':
          docChildren.push(mkH2(item.text));
          break;
        case 'h3':
          docChildren.push(new D.Paragraph({
            children: [new D.TextRun({ text: item.text, font: bodyFontName, size: bodySize, bold: true })],
            spacing: { before: 200, after: 80 }
          }));
          break;
        case 'para':
          docChildren.push(mkParaWithMath(item.text));
          break;
        case 'kw':
          docChildren.push(new D.Paragraph({
            children: [new D.TextRun({ text: item.text, font: bodyFontName, size: bodySize })],
            spacing: { line: bodyLhTwips, before: 160 }
          }));
          break;
        case 'formula':
          docChildren.push(buildMathForLatex(item.latex, item.num || ''));
          break;
        case 'refs':
          for (const ref of item.items) {
            docChildren.push(mkRef(ref));
          }
          break;
      }
    }

    // ── build Document ──
    const doc = new D.Document({
      styles: {
        paragraphStyles: []
      },
      sections: [{
        properties: {
          page: {
            margin: {
              top: 1134,   // 2cm = 1133.86 twips
              bottom: 1134,
              left: 1417,  // 2.5cm (2cm + 0.5cm gutter)
              right: 1134,
              gutter: 284  // 0.5cm
            }
          }
        },
        headers: {
          default: new D.Header({
            children: [new D.Paragraph({
              children: [new D.TextRun({ text: '东南大学本科生创新训练计划项目', font: bodyFontName, size: 18 })],
              alignment: D.AlignmentType.CENTER,
              border: { bottom: { style: D.BorderStyle.SINGLE, size: 6, color: '999999', space: 1 } }
            })]
          })
        },
        children: docChildren
      }]
    });

    const blob = await D.Packer.toBlob(doc);
    saveAs(blob, '结项报告.docx');
    notify('✅ DOCX 下载成功！', 3000);

  } catch(err) {
    console.error('DOCX export error:', err);
    notify('❌ DOCX 生成失败：' + err.message, 5000);
  }
}

/** Convert CSS pt value string to half-points integer (docx unit) */
function ptToHalfPt(ptStr) {
  return Math.round(parseFloat(ptStr) * 2);
}

/** Extract the first font family name from a CSS font-family string */
function getDocxFontName(cssFontFamily) {
  const first = cssFontFamily.split(',')[0].trim().replace(/'/g,'').replace(/"/g,'');
  return first;
}

/** Strip LaTeX markup from inline math ($...$) for plain-text export */
function stripInlineMath(text) {
  return text
    .replace(/\$\$[^$]+\$\$/g, '[公式]')
    .replace(/\$[^$]+\$/g, s => {
      const inner = s.slice(1,-1);
      // Very rough LaTeX to unicode conversion for common symbols
      return inner
        .replace(/\\mathcal\{([A-Z])\}/g,'$1')
        .replace(/\\mathbb\{([A-Z])\}/g,'$1')
        .replace(/\\mathrm\{([^}]+)\}/g,'$1')
        .replace(/\\text\{([^}]+)\}/g,'$1')
        .replace(/\\le\b/g,'≤').replace(/\\ge\b/g,'≥')
        .replace(/\\neq\b/g,'≠').replace(/\\approx\b/g,'≈')
        .replace(/\\in\b/g,'∈').replace(/\\notin\b/g,'∉')
        .replace(/\\subset/g,'⊂').replace(/\\cup/g,'∪').replace(/\\cap/g,'∩')
        .replace(/\\infty/g,'∞').replace(/\\pm/g,'±')
        .replace(/\\alpha/g,'α').replace(/\\beta/g,'β').replace(/\\gamma/g,'γ')
        .replace(/\\delta/g,'δ').replace(/\\epsilon/g,'ε').replace(/\\varepsilon/g,'ε')
        .replace(/\\sigma/g,'σ').replace(/\\lambda/g,'λ').replace(/\\mu/g,'μ')
        .replace(/\\phi/g,'φ').replace(/\\varphi/g,'φ').replace(/\\psi/g,'ψ')
        .replace(/\\omega/g,'ω').replace(/\\theta/g,'θ')
        .replace(/\\top/g,'ᵀ').replace(/\\cdot/g,'·')
        .replace(/\\ldots/g,'…').replace(/\\cdots/g,'…')
        .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g,'($1)/($2)')
        .replace(/\^/g,'').replace(/_/g,'').replace(/\{|\}/g,'')
        .replace(/\\/g,'').trim();
    });
}

/* ============================================================
   PDF EXPORT  –  uses html2pdf.js
   ============================================================ */
async function exportToPDF() {
  notify('⏳ 正在生成 PDF…', 10000);
  await new Promise(r=>setTimeout(r,50));

  // wait up to 15s for html2pdf
  const waitPdf = new Promise((res,rej) => {
    if (window.html2pdf) { res(); return; }
    const t0 = Date.now();
    const iv = setInterval(()=>{
      if (window.html2pdf) { clearInterval(iv); res(); }
      else if (Date.now()-t0>15000) { clearInterval(iv); rej(new Error('html2pdf.js 加载超时，请检查网络后刷新')); }
    },200);
  });
  try { await waitPdf; }
  catch(e) { notify('❌ '+e.message, 6000); return; }

  const el = document.getElementById('document-page');
  const opt = {
    margin: 0,
    filename: '结项报告.pdf',
    image: { type:'jpeg', quality:0.97 },
    html2canvas: { scale:2, useCORS:true, letterRendering:true },
    jsPDF: { unit:'mm', format:'a4', orientation:'portrait' }
  };

  html2pdf().set(opt).from(el).save()
    .then(()=>notify('✅ PDF 下载成功！', 3000))
    .catch(e=>notify('❌ PDF 生成失败：'+e.message, 5000));
}

/* ============================================================
   INIT
   ============================================================ */
function runKaTeX() {
  if (!window.renderMathInElement) return;
  renderMathInElement(document.getElementById('doc-content'), {
    delimiters: [
      { left:'$$', right:'$$', display:true },
      { left:'$',  right:'$',  display:false },
      { left:'\\[', right:'\\]', display:true },
      { left:'\\(',  right:'\\)',  display:false }
    ],
    throwOnError: false
  });
}

window.addEventListener('load', () => {
  renderContent();
  applyStyles();
  // KaTeX may already be loaded (fast CDN) or arrive later via dynamic loader
  if (window.renderMathInElement) {
    runKaTeX();
  } else {
    // will be called by the dynamic loader once auto-render lands
    window._katexCallback = runKaTeX;
  }
});
</script>
