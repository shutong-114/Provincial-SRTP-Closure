<!-- ===== DYNAMIC SCRIPT LOADER (multi-CDN fallback) ===== -->
<script>
/**
 * Try loading a script from each URL in sequence; resolve on first success.
 * If all fail, resolve anyway (caller checks window global).
 */
function loadScript(urls, globalCheck) {
  return new Promise(resolve => {
    let idx = 0;
    function tryNext() {
      if (idx >= urls.length) { resolve(false); return; }
      const url = urls[idx++];
      const s = document.createElement('script');
      s.src = url;
      s.crossOrigin = 'anonymous';
      s.onload = () => {
        // Some UMD bundles need a tick to set the global
        setTimeout(() => {
          if (!globalCheck || globalCheck()) { resolve(true); }
          else { tryNext(); }           // script loaded but global not set → try next
        }, 30);
      };
      s.onerror = () => { document.head.removeChild(s); tryNext(); };
      document.head.appendChild(s);
    }
    tryNext();
  });
}

// Track readiness
window._libReady = { katex: false, docx: false, fileSaver: false, html2pdf: false };

// KaTeX
loadScript([
  'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
  'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
], () => !!window.katex).then(ok => {
  if (ok) loadScript([
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js',
    'https://unpkg.com/katex@0.16.9/dist/contrib/auto-render.min.js'
  ], () => !!window.renderMathInElement).then(() => {
    window._libReady.katex = true;
    if (window._katexCallback) window._katexCallback();
  });
});

// docx.js — try unpkg first (more reliable UMD build path), then jsDelivr
loadScript([
  'https://unpkg.com/docx@8.5.0/build/index.js',
  'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js',
  'https://unpkg.com/docx@7.8.2/build/index.js',
  'https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js'
], () => !!(window.docx && window.docx.Document)).then(ok => {
  window._libReady.docx = ok;
  updateLibStatus();
});

// FileSaver
loadScript([
  'https://unpkg.com/file-saver@2.0.5/dist/FileSaver.min.js',
  'https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js'
], () => typeof saveAs === 'function').then(ok => {
  window._libReady.fileSaver = ok;
  updateLibStatus();
});

// html2pdf
loadScript([
  'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js',
  'https://unpkg.com/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js'
], () => !!window.html2pdf).then(ok => {
  window._libReady.html2pdf = ok;
  updateLibStatus();
});

function updateLibStatus() {
  const bar = document.getElementById('lib-status');
  if (!bar) return;
  const allReady = window._libReady.docx && window._libReady.fileSaver;
  if (allReady) {
    bar.style.display = 'none';
  } else {
    const parts = [];
    if (!window._libReady.docx) parts.push('docx.js');
    if (!window._libReady.fileSaver) parts.push('FileSaver');
    bar.textContent = '⏳ 正在加载库：' + parts.join('、') + '…';
  }
}
</script>

<script>
/* ============================================================
   CONTENT DATA
   每条记录 type:
     'h0'      – 摘要标题（与h1同级但无章号）

     'ref'     – 参考文献条目（数组）
   ============================================================ */
const CONTENT = [

// ── 摘要 ──────────────────────────────────────────────────────
{type:'h0', text:'摘  要'},
{type:'para', text:'本项目围绕多机器人系统在障碍物密集环境中的编队导航与协同控制问题展开研究，构建了一套从感知、规划到控制的完整技术体系。在全局规划层面，基于增强型A*算法生成兼顾安全性的全局路径；在局部规划层面，建立了以局部自由空间（Local Free Space）为核心的约束优化框架，结合形状理论实现保形编队；在编队控制层面，研究了集中式与分布式两类投影算法以及基于罚函数的队形优化方案；在感知层面，开发了激光雷达点云处理与实时局部自由空间计算模块；在机器人内部避碰方面，引入互反速度障碍（RVO）构建分层避障体系。此外，项目还探索了编队在区域覆盖任务中的应用，并通过Python数值仿真与ROS物理仿真对整体方案进行了验证，算法在每步优化平均约12毫秒的条件下成功引导机器人通过多个狭窄通道，编队约束残差收敛至机器精度。'},
{type:'kw', text:'关键词：多机器人系统；最优编队；分布式优化；路径规划；局部自由空间；形状理论；编队覆盖'},

// ── 第一章 引言 ────────────────────────────────────────────────
{type:'h1', text:'第一章  引  言'},
{type:'h2', text:'1.1  研究背景与意义'},
{type:'para', text:'多机器人系统（Multirobot Systems，MRSs）在物流仓储、环境监测、搜索救援及自动化运输等领域的应用日益广泛，协作行为能够显著提升整体系统的效率、鲁棒性和可扩展性。其中，使机器人群体在保持预定编队形状的同时，安全穿越障碍密集的复杂环境，是多机器人协同控制领域的核心挑战之一。这一问题要求方法能够同时处理全局路径规划、局部避障与编队保持三个相互耦合的子问题。'},
{type:'para', text:'传统方案往往将路径规划与编队控制解耦处理：A*等全局规划算法[1][2]生成的路径常过于靠近障碍物，在狭窄通道中缺乏安全裕度；基于Voronoi图[4][5][6]或功率图[7]的导航方法仅关注单机器人或整体几何结构，未能同时维持编队形状；而编队控制文献[9][10]多针对开阔空间，鲜少考虑障碍物带来的几何约束。本项目在综合上述研究的基础上，构建了局部自由空间约束下的最优编队框架，并进一步探索了分布式优化、罚函数方法及区域覆盖等扩展方向。'},

{type:'h2', text:'1.2  研究现状综述'},
{type:'para', text:'在全局路径规划方面，文献[3]提出的安全增强型A*在路径代价中融入障碍物距离惩罚，有效提升了生成路径的安全裕度。基于Voronoi结构的方法（文献[4][5][6]）通过利用拓扑图结构进一步提升了导航鲁棒性。文献[7]的功率图方法通过构造凸无碰撞区域引导机器人精确导航，是局部自由空间概念的重要前驱工作。'},
{type:'para', text:'在编队优化方面，形状理论[9]将编队形状约束线性化，使其可纳入凸优化框架。文献[10]给出了基于投影的集中式最优编队算法；文献[11]则进一步提出了利用拉普拉斯矩阵的分布式编队优化方法；文献[19]（本项目组成果之一）基于局部估计器将集中式编队优化扩展为完全分布式方案，大幅降低了通信开销。在机器人间碰撞避免方面，RVO及其改进变体[12][13][14][15]为多机协同提供了高效的实时避碰机制。'},

{type:'h2', text:'1.3  项目工作概述'},
{type:'para', text:'本项目由团队成员分工协作，涵盖以下主要工作：（1）增强型A*全局路径规划的设计与实现；（2）基于局部自由空间的编队优化算法及其收敛性证明；（3）以局部估计器为核心的分布式优化扩展方案；（4）激光雷达感知模块与实时局部自由空间计算；（5）基于罚函数的多目标队形优化方法；（6）内部碰撞避免的RVO集成；（7）Python数值仿真与ROS平台仿真验证；（8）编队在区域覆盖任务中的应用探索。各部分通过统一的凸优化与投影算法框架有机衔接，形成完整的多机器人协同控制技术体系。'},

// ── 第二章 问题描述 ────────────────────────────────────────────
{type:'h1', text:'第二章  问题描述'},
{type:'h2', text:'2.1  系统模型'},
{type:'para', text:'考虑一个封闭工作空间 $\\mathcal{W}$，其中包含 $m$ 个圆盘形（或凸多边形）静态障碍物，以及 $n$ 个圆盘形机器人。第 $j$ 个障碍物（$1\\le j\\le m$）的圆心记为 $O_j$，半径为 $R_j$；第 $i$ 个机器人（$1\\le i\\le n$）的圆心记为 $p_i$，半径为 $r_i$，令 $r_m=\\max_i r_i$。编队质心记为 $p_c$。为排除边界碰撞风险，将有效工作空间收缩为：'},
{type:'formula', latex:'\\widetilde{\\mathcal{W}}=\\{q\\in\\mathcal{W}\\mid B(q,r_m)\\subseteq\\mathcal{W}\\}', num:'(1)'},
{type:'para', text:'后文中 $\\mathcal{W}$ 均指 $\\widetilde{\\mathcal{W}}$。为保证机器人群体与外部障碍物不发生碰撞，引入局部自由空间（Local Free Space）的核心概念：对于圆盘障碍物 $O_j$，构造分隔编队中心与障碍物的半平面 $H_j$，局部自由空间定义为所有此类半平面的交集：'},
{type:'formula', latex:'\\mathcal{LF}(x)=\\left\\{q\\in\\mathcal{W}\\;\\middle|\\;(q-p_c)^{\\top}d_j\\le c_j,\\;\\forall j\\right\\}', num:'(2)'},
{type:'para', text:'其中 $d_j=(O_j-p_c)/\\|O_j-p_c\\|$ 为指向障碍物的单位法向量，$c_j=\\|O_j-p_c\\|-(R_j+r_m)$ 为安全裕度。对凸多边形障碍物，类似地取最近边的单位法向量构造对应半平面。由于 $\\mathcal{LF}$ 是多个半平面（凸集）的交集，它本身也是凸集，机器人质心位于 $\\mathcal{LF}$ 内即可保证不与任何障碍物碰撞。'},

{type:'h2', text:'2.2  最优编队优化问题'},
{type:'para', text:'编队形状由 $n$ 个参考点 $S=(s_1,\\ldots,s_n)\\in\\mathbb{R}^{2\\times n}$ 描述，形状等价类 $[S]$ 包含所有可由 $S$ 经旋转、缩放和平移得到的编队。项目的核心优化目标是：在保持编队形状并满足局部自由空间约束的前提下，最小化各机器人的位移代价：'},
{type:'formula', latex:'\\min_{q}\\;\\frac{\\lambda}{2}\\|q-T\\|^2+(1-\\lambda)\\|q-T\\|_1\\qquad\\text{s.t.}\\;Aq=0,\\;q\\in\\mathcal{LF}^n', num:'(3)'},
{type:'para', text:'其中 $q=(q_1^\\top,\\ldots,q_n^\\top)^\\top\\in\\mathbb{R}^{2n}$ 为各机器人目标位置的拼接向量，$T$ 为当前虚拟目标，$\\lambda\\in[0,1]$ 为权重系数（$\\ell^2$/$\\ell^1$ 平衡因子），$A$ 为由形状理论导出的编队约束矩阵（满足 $Aq=0$ 等价于 $Q\\in[S]$），$\\mathcal{LF}^n$ 为所有机器人局部自由空间的笛卡儿积。'},

// ── 第三章 全局路径规划 ───────────────────────────────────────
{type:'h1', text:'第三章  全局路径规划'},
{type:'h2', text:'3.1  增强型A*算法'},
{type:'para', text:'全局路径规划采用基于增强型A*的算法。经典A*的代价函数为 $f(n)=g(n)+h(n)$，其中 $g(n)$ 为到达节点 $n$ 的实际代价，$h(n)$ 为到目标的启发估计。为使生成路径远离障碍物边界，引入与障碍物距离相关的安全权重因子 $W$，将运动代价修正为：'},
{type:'formula', latex:'g(n)=g(n-1)+W\\cdot d_{n-1\\to n},\\quad W=1+\\dfrac{1}{d_{\\min}+\\varepsilon}', num:'(4)'},
{type:'para', text:'其中 $d_{\\min}$ 为当前节点到最近障碍物或边界的距离，$\\varepsilon$ 为防止除零的小正数。当路径靠近障碍物时，$W$ 显著增大，使算法自动倾向于选择远离危险区域的路径，从而生成安全裕度更大的全局轨迹。'},
{type:'para', text:'增强型A*在离散化地图中搜索，输出一条从起始点 $B$ 到目标点 $T_0$ 的有序路点序列 $P=\\{B,T_1,T_2,\\ldots,T_k,T_0\\}$。编队中心依次以各虚拟目标 $T_i$ 为引导，逐段推进，直至到达终点。'},

// ── 第四章 局部路径规划与感知 ─────────────────────────────────
{type:'h1', text:'第四章  局部路径规划与感知'},
{type:'h2', text:'4.1  基于局部自由空间的最优编队算法'},
{type:'para', text:'局部路径规划的核心任务是：给定当前目标 $T$，在局部自由空间 $\\mathcal{LF}$ 约束下求解优化问题（3），得到下一步的最优路点 $Q^*$。利用凸优化的最优性条件，该问题等价于求解不动点方程组：'},
{type:'formula', latex:'\\begin{cases}q^*=\\varphi\\bigl(q^*-\\sigma[\\lambda(q^*-T)+(1-\\lambda)z^*+A^{\\top}y^*]\\bigr)\\\\Aq^*=0\\\\z^*=\\psi(z^*+q^*-T)\\end{cases}', num:'(5)'},
{type:'para', text:'其中 $\\sigma>0$ 为步长，$\\varphi:\\mathbb{R}^{2n}\\to\\mathcal{LF}^n$ 为投影到局部自由空间的投影算子，$\\psi:\\mathbb{R}^{2n}\\to[-1,1]^{2n}$ 为投影到 $\\ell^\\infty$ 单位球的算子，$y^*$ 为形状约束的拉格朗日乘子。由此导出可迭代执行的投影算法：'},
{type:'formula', latex:'\\begin{cases}q_{k+1}=\\varphi\\bigl(q_k-\\sigma[\\lambda(q_k-T)+(1-\\lambda)\\psi(z_k+q_k-T)+A^{\\top}(y_k+Aq_k)]\\bigr)\\\\y_{k+1}=y_k+Aq_{k+1}\\\\z_{k+1}=\\psi(z_k+q_{k+1}-T)\\end{cases}', num:'(6)'},
{type:'para', text:'迭代收敛后得到满足形状约束与局部自由空间约束的最优路点。整体导航流程为：利用增强型A*初始化全局路径，然后对每个虚拟目标反复调用上述迭代算法获取当前最优路点，机器人到达后更新目标，直至抵达终点。'},

{type:'h2', text:'4.2  激光雷达感知与点云处理'},
{type:'para', text:'在实际部署中，机器人的局部自由空间 $\\mathcal{LF}$ 需从传感器实时观测中动态构建，而非依赖预知的全局地图。为此，项目开发了一套完整的激光雷达感知处理流水线，将原始传感器数据转化为可直接用于优化求解的结构化自由空间描述。'},
{type:'para', text:'激光雷达仿真器模拟了机器人的激光扫描过程，采用步进式射线投射算法精确计算与圆形障碍物及凸多边形障碍物的交点，并叠加高斯噪声以模拟真实传感器误差。原始点云经过以下两步处理转化为结构化障碍物表示：首先，基于广度优先搜索（BFS）按空间邻近距离阈值将点云划分为若干聚类，每个聚类对应一个独立障碍物；然后，对通过最小点数筛选的聚类计算二维凸包，得到描述该障碍物外轮廓的凸多边形。将环境障碍物统一表示为凸多边形，极大简化了后续碰撞检测与自由空间计算的几何复杂度。'},

{type:'h2', text:'4.3  基于半平面约束的实时自由空间计算'},
{type:'para', text:'获得凸多边形障碍物列表后，采用 Sutherland-Hodgman 多边形裁剪算法动态构建局部自由空间。算法以地图边界内缩机器人（或编队外接圆）半径后的矩形为初始安全区域，针对每个障碍物凸多边形，找到距离机器人几何中心最近的边，将其向外平移一个安全距离后作为半平面约束，对当前安全区域进行裁剪。迭代处理所有障碍物后，得到的局部自由空间是一个凸多边形，保证几何中心位于其内的机器人不与任何障碍物碰撞。'},
{type:'para', text:'该感知模块在单机导航验证中取得了良好效果：与改进型人工势场（APF）算法集成后，能够在无全局地图条件下完成实时无碰撞导航。多机扩展实验中发现，独立的感知-APF规划与底层RVO避碰之间存在目标冲突，系统易陷入局部停滞。这一发现揭示了多机场景下跨层协调的关键需求，也进一步说明了本项目采用统一优化框架的必要性。'},

// ── 第五章 编队算法 ───────────────────────────────────────────
{type:'h1', text:'第五章  编队算法'},
{type:'h2', text:'5.1  形状理论（Shape Theory）'},
{type:'para', text:'编队形状约束的数学基础来自形状理论。给定参考编队 $S=(s_1,\\ldots,s_n)$，形状等价类 $[S]$ 包含所有可由 $S$ 经旋转、缩放和平移导出的编队。规定 $s_1=(0,0)$ 且 $s_2$ 在 $x$ 轴上，则等价类中任意编队 $Q$ 满足 $p_i-p_1=cRs_i$（$c>0$，$R\\in\\mathrm{SO}(2)$）。将坐标视为复数，可得关系 $s_2\\cdot(p_i-p_1)=s_i\\cdot(p_2-p_1)$，写成矩阵形式：'},
{type:'formula', latex:'M_2(p_i-p_1)=M_i(p_2-p_1),\\quad M_i=\\begin{pmatrix}s_{i,x}&-s_{i,y}\\\\s_{i,y}&s_{i,x}\\end{pmatrix}', num:'(7)'},
{type:'para', text:'汇总所有机器人（$i=3,\\ldots,n$）的约束，可构造矩阵 $A$ 使得 $Aq=0$ 与 $Q\\in[S]$ 等价。形状理论将旋转—缩放不变性的编队约束线性化，使其可以直接融入凸优化框架，是后续集中式与分布式编队算法的共同出发点。'},

{type:'h2', text:'5.2  集中式投影最优编队算法'},
{type:'para', text:'在集中式场景下，所有机器人的状态信息汇集到一个中央节点求解优化问题（3）。第四章给出的迭代算法（6）即为集中式版本：每次迭代中，由中央节点统一计算所有机器人的目标位置 $q_k$，并将其投影到局部自由空间，随后通过拉格朗日乘子和次梯度更新保证编队约束的满足。算法全局收敛性已被严格证明（见第七章），步长条件为：'},
{type:'formula', latex:'\\sigma<\\dfrac{1}{2+\\lambda_{\\max}(A^{\\top}A)}', num:'(8)'},
{type:'para', text:'集中式方案在计算精度和理论保证方面有优势，仿真验证表明4机器人系统可在平均12毫秒内完成单步优化，编队约束残差收敛至机器精度 $10^{-14}$。但其缺点在于通信开销随机器人数量线性增长——编队锚点机器人（机器人1和机器人2）需与所有其他机器人直接通信，当系统规模扩大时通信瓶颈明显。'},

{type:'h2', text:'5.3  分布式优化扩展'},
{type:'para', text:'为克服集中式方案的通信瓶颈，项目参考文献[19]的工作，探索了将集中式编队优化改造为分布式方案的技术路径。分布式化的核心思想是：为每个机器人 $i$（$i=3,\\ldots,m$）引入一对局部估计量 $p_{i1}$、$p_{i2}$，分别估计机器人1和机器人2的位置，从而将需要全局广播的形状约束 $M(p_i-p_1)=M_i(p_2-p_1)$ 替换为仅依赖本地估计的约束：'},
{type:'formula', latex:'B_i\\tilde{p}_i=0,\\quad B_i=\\bigl(M\\;\\;M_i{-}M\\;\\;{-}M_i\\bigr),\\quad\\tilde{p}_i=(p_i^\\top,p_{i1}^\\top,p_{i2}^\\top)^\\top', num:'(9)'},
{type:'para', text:'各机器人的局部估计需最终收敛至真实值，这通过引入基于网络拉普拉斯矩阵 $L$ 的一致性约束来保证：'},
{type:'formula', latex:'(L\\otimes I_2)\\mathbf{p}_1=0,\\quad(L\\otimes I_2)\\mathbf{p}_2=0', num:'(10)'},
{type:'para', text:'其中 $\\mathbf{p}_1=(p_1^\\top,p_{21}^\\top,\\ldots,p_{m1}^\\top)^\\top$，$\\mathbf{p}_2=(p_{12}^\\top,p_2^\\top,\\ldots,p_{m2}^\\top)^\\top$，$\\otimes$ 为 Kronecker 积。将形状约束（9）、一致性约束（10）、锚点约束 $p_1-p_2=b$ 以及局部可行域约束统一合并，整体分布式优化问题可以紧凑地写为：'},
{type:'formula', latex:'\\min_{\\tilde{p}}\\;\\frac{1}{2}\\|\\tilde{c}\\tilde{p}-\\tilde{\\xi}\\|^2\\quad\\text{s.t.}\\;\\tilde{B}\\tilde{p}=\\tilde{b},\\;(\\tilde{L}_1\\otimes I_2)\\tilde{p}=0,\\;(\\tilde{L}_2\\otimes I_2)\\tilde{p}=0,\\;\\tilde{p}\\in\\tilde{\\Omega}', num:'(11)'},
{type:'para', text:'其中 $\\tilde{p}\\in\\mathbb{R}^{6m-4}$ 为增广状态向量，包含所有机器人的真实位置及其局部估计量；$\\tilde{c}$ 为从增广向量中提取真实位置的选择矩阵；$\\tilde{\\xi}$ 为初始位置向量；$\\tilde{L}_1$、$\\tilde{L}_2$ 由原始拉普拉斯矩阵按增广变量排列扩展而来。对应的分布式投影迭代算法为：'},
{type:'formula', latex:'\\begin{cases}\\tilde{p}_{k+1}=\\varphi\\!\\left(\\tilde{p}_k-\\sigma\\bigl(\\tilde{c}^\\top(\\tilde{c}\\tilde{p}_k-\\tilde{\\xi})+\\tilde{B}^\\top(\\tilde{y}_k+\\tilde{B}\\tilde{p}_k-\\tilde{b})+\\tilde{z}_k+(\\tilde{L}_1\\otimes I_2)\\tilde{p}_k+\\tilde{w}_k+(\\tilde{L}_2\\otimes I_2)\\tilde{p}_k\\bigr)\\right)\\\\[4pt]\\tilde{y}_{k+1}=\\tilde{y}_k+\\tilde{B}\\tilde{p}_{k+1}-\\tilde{b}\\\\[4pt]\\tilde{z}_{k+1}=\\tilde{z}_k+(\\tilde{L}_1\\otimes I_2)\\tilde{p}_{k+1}\\\\[4pt]\\tilde{w}_{k+1}=\\tilde{w}_k+(\\tilde{L}_2\\otimes I_2)\\tilde{p}_{k+1}\\end{cases}', num:'(12)'},
{type:'para', text:'上述算法的核心特点是：每个机器人 $i$ 在每步迭代中只需与其通信邻居交换 $p_i$、$p_{i1}$、$p_{i2}$ 三个二维向量，原先的全局广播需求被完全消除。当通信图无向连通（拉普拉斯矩阵 $L$ 满足 $0=\\lambda_1<\\lambda_2\\le\\cdots\\le\\lambda_m$）时，算法对任意初始值全局收敛，收敛步长条件为：'},
{type:'formula', latex:'\\sigma\\le\\dfrac{1}{\\lambda_{\\max}\\!\\left(2\\tilde{c}^\\top\\tilde{c}+\\tilde{B}^\\top\\tilde{B}+\\tilde{L}_1\\otimes I_2+\\tilde{L}_2\\otimes I_2\\right)}', num:'(13)'},
{type:'para', text:'仿真以33台机器人组成环形通信拓扑为例，验证了算法能够在 $\\Omega_i=[-8,8]^2$ 的约束区域内将机器人从任意初始散布状态引导至字母"M"形目标编队，通信量相比集中式方案大幅减少，同时保持了同等的收敛精度。'},

{type:'h2', text:'5.4  基于罚函数的队形优化'},
{type:'para', text:'除上述基于投影的迭代算法外，项目还实现了另一种互补性更强的编队优化方案——基于罚函数的无约束化方法。该方法将队形保持、机器人间碰撞避免和区域边界约束三类目标统一表达为加权罚项之和，从而将带约束的多目标优化转化为可直接用梯度下降法求解的无约束问题。'},
{type:'para', text:'总代价函数 $J_{\\text{total}}$ 由三部分组成：'},
{type:'formula', latex:'J_{\\text{total}}(X)=J_{\\text{form}}(X)+J_{\\text{col}}(X)+J_{\\text{reg}}(X)', num:'(14)'},
{type:'para', text:'队形代价 $J_{\\text{form}}$ 衡量当前位置与目标队形之间的偏差：$J_{\\text{form}}=w_{\\text{form}}\\sum_i\\|x_i-t_i^*\\|^2$，其中 $t_i^*$ 为经平移对齐后的目标点。设两机器人 $m$ 与 $n$ 之间的相对位置向量为 $r_1^{(mn)}=x_m-x_n$，安全距离（圆心间最小允许距离）为 $d$，报警距离（$A>d$）为 $A$。碰撞避免代价构建为：'},
{type:'formula', latex:'J_{\\text{col}}(X)=w_{\\text{col}}\\cdot\\sum_{m<n}\\bigl[\\min\\!\\bigl(0,\\,\\psi(r_1^{(mn)})\\bigr)\\bigr]^2', num:'(15)'},
{type:'para', text:'其中 $\\psi$ 函数定义为：'},
{type:'formula', latex:'\\psi(r_1^{(mn)})=\\dfrac{\\|r_1^{(mn)}\\|^2-A^2}{\\|r_1^{(mn)}\\|^2-d^2}'},
{type:'para', text:'区域约束代价 $J_{\\text{reg}}$ 采用外罚函数形式，对越出凸多边形安全区域 $\\mathcal{LF}$ 的机器人按越界距离的平方施加惩罚，权重 $w_{\\text{reg}}$ 通常取较大值（如1000）以确保约束被严格满足。优化求解采用带动量项的梯度下降：'},
{type:'formula', latex:'\\Delta x^{k+1}=-\\sigma\\nabla J_{\\text{total}}(X^k)-\\eta\\,\\Delta x^k', num:'(16)'},
{type:'para', text:'其中 $\\sigma$ 为步长，$\\eta$ 为动量系数，并通过梯度裁剪（模长上限10.0）和步长裁剪（单步上限0.5）保证数值稳定性。实验表明，该方案对初始位置不敏感，能够有效处理不规则凸多边形约束下的队形优化问题，是集中式投影算法在工程实现层面的有益补充。'},

// ── 第六章 内部碰撞避免 ──────────────────────────────────────
{type:'h1', text:'第六章  内部碰撞避免'},
{type:'h2', text:'6.1  互反速度障碍（RVO）方法'},
{type:'para', text:'机器人群体在向最优路点移动的过程中，还需防止机器人之间发生相互碰撞。项目采用互反速度障碍（Reciprocal Velocity Obstacles，RVO）方法[18]作为内部碰撞避免层。RVO的核心思想是：对于机器人 $i$ 和 $j$，以双方速度的对称中点为基准，定义 $j$ 对 $i$ 施加的RVO集合：'},
{type:'formula', latex:'\\mathrm{RVO}_{ij}(v_j,v_i)=\\bigl\\{v_i\'\\mid 2v_i\'-v_i\\in\\mathrm{VO}_{ij}(v_j)\\bigr\\}'},
{type:'para', text:'其中 $\\mathrm{VO}_{ij}(v_j)$ 为假设 $v_j$ 固定时机器人 $i$ 会与 $j$ 发生碰撞的速度集合。RVO中的速度是当前速度与原始VO速度的平均，"分担"了避碰责任，保证了对称互反性，避免了多机场景中的震荡问题。'},

{type:'h2', text:'6.2  速度选择策略'},
{type:'para', text:'每个机器人首先根据当前最优路点计算期望速度 $v_{\\mathrm{pref},i}$，然后在满足运动学约束的可达速度集合 $G_i$ 中剔除所有RVO约束的并集 $O_i$，寻找与期望速度偏差最小的安全速度：$v_i=\\arg\\min_{v\\in G_i\\setminus O_i}\\|v-v_{\\mathrm{pref},i}\\|$。若无碰撞速度不存在，则引入碰撞时间 $t_i^{\\mathrm{col}}$ 作为惩罚项选取次优速度。'},
{type:'para', text:'通过外层局部自由空间（编队整体与障碍物的碰撞避免）与内层RVO（机器人之间的碰撞避免）的分层协同，系统构成了完整的两级避障体系，两层各司其职、相互独立，显著降低了整体算法复杂度。'},

// ── 第七章 收敛性分析 ─────────────────────────────────────────
{type:'h1', text:'第七章  收敛性分析'},
{type:'h2', text:'7.1  集中式算法的收敛性'},
{type:'para', text:'对于集中式投影迭代算法（6），已证明：对任意初始值 $(q_0,y_0,z_0)$，当步长满足条件（8）时，迭代序列 $\\{q_k\\}$ 全局收敛至优化问题（3）的最优解 $q^*$。证明思路如下：构造李雅普诺夫候选函数'},
{type:'formula', latex:'V(q_k,y_k,z_k)=\\|q_k-q^*\\|^2+\\sigma\\bigl(\\|y_k-y^*\\|^2+(1-\\lambda)\\|z_k-z^*\\|^2\\bigr)'},
{type:'para', text:'通过对三组变量的更新规则分别推导增量不等式，并加权叠加可得 $V(q_{k+1},y_{k+1},z_{k+1})\\le V(q_k,y_k,z_k)$，即 $V$ 沿轨迹单调不增。再由离散时间LaSalle不变性原理，可严格确立全局收敛性[10]。仿真验证表明，形状约束残差 $\\|Aq_k\\|$ 在绝大多数路点的20次迭代内即收敛至机器精度 $10^{-14}$。'},

{type:'h2', text:'7.2  分布式算法的收敛性'},
{type:'para', text:'对于分布式投影迭代算法（12），类似地构造四分量李雅普诺夫函数[19]：'},
{type:'formula', latex:'V=\\|\\tilde{p}_k-\\tilde{p}^*\\|^2+\\sigma\\bigl(\\|\\tilde{y}_k-\\tilde{y}^*\\|^2+V_3(\\tilde{\\theta}_k)+V_4(\\tilde{\\eta}_k)\\bigr)'},
{type:'para', text:'其中 $V_3$、$V_4$ 分别为关于两组一致性对偶变量的加权二次项。当步长满足条件（13）时，矩阵 $I-\\sigma(2\\tilde{c}^\\top\\tilde{c}+\\tilde{B}^\\top\\tilde{B}+\\tilde{L}_1\\otimes I_2+\\tilde{L}_2\\otimes I_2)$ 正定，结合 $\\tilde{L}_1\\otimes I_2$ 和 $\\tilde{L}_2\\otimes I_2$ 的半正定性，可得 $V$ 单调不增，从而保证全局收敛。关键结论：只要通信图无向连通（拉普拉斯矩阵有正的第二小特征值），分布式算法对任意初始值均收敛。'},

// ── 第八章 仿真结果 ───────────────────────────────────────────
{type:'h1', text:'第八章  仿真结果'},
{type:'h2', text:'8.1  Python数值仿真'},
{type:'para', text:'在 $[0,20]\\times[0,20]$ 的平面工作空间中部署4个同质机器人（$n=4$），初始状态为正方形编队，环境中分布有若干静态圆盘形障碍物。所有机器人依照"全局A*规划→局部自由空间优化→RVO避碰"的流程执行导航任务。仿真结果表明，所有机器人在45秒内到达目标位置，以安全裕度0.3成功通过5个狭窄通道，单步优化平均耗时约12毫秒，具备良好的实时性。'},
{type:'para', text:'自适应安全区域 $\\mathcal{LF}(x)$（图中绿色凸多边形）随机器人位置实时更新，在狭窄通道处发生明显收缩，有效压制了编队宽度，引导机器人群体安全穿越。与固定几何形状的基础A*规划器相比，基于局部自由空间的方案在通过狭窄通道时显著减少了碰撞发生次数，且编队保持质量更优。'},

{type:'h2', text:'8.2  收敛性验证'},
{type:'para', text:'对3个代表性路点（首个中间路点、约3/4处路点和终点路点）分别进行收敛性分析。左侧图显示编队约束残差 $\\|Aq_k-b\\|$ 快速下降至 $10^{-14}$ 量级，验证了形状约束在迭代过程中被精确满足；右侧图中迭代更新范数 $\\|q_k-\\varphi(q_k-\\sigma(\\lambda(q_k-T)+(1-\\lambda)z_k+A^\\top y_k))\\|$ 趋近于零，证明了优化目标函数收敛至最小值。三个路点的结果均表现一致，证明算法在整个导航过程中保持稳定。'},

{type:'h2', text:'8.3  基于ROS的仿真验证'},
{type:'para', text:'为进一步评估算法在接近真实部署场景下的性能，项目在Ubuntu 20.04 + ROS Noetic环境中搭建了物理仿真平台，以Gazebo为物理引擎并结合RVIZ进行可视化。实验场地为5m×5m，布置了木质方块、橙色立杆及白色油桶等不同几何形状的静态障碍物，部署4台TurtleBot3 Burger同构机器人，通过订阅各机器人的 /odom 话题获取位姿，经由 /cmd_vel 话题发送控制指令，实现了闭环控制。'},
{type:'para', text:'Gazebo仿真结果表明，机器人编队在从起点向终点运动的过程中，能够根据物理环境约束自适应调整几何间距，全程未发生碰撞，控制律在包含真实摩擦力和惯性动力学的物理仿真中依然保持稳定。RVIZ可视化界面中，绿色点阵轨迹勾勒出A*规划的全局路径，红色球体标示实时理想编队槽位，蓝色多边形实时反映自适应安全区域的动态变化，当编队穿越障碍物缝隙时，蓝色多边形发生可见的收缩与形变。系统在测试中保持了约12毫秒的低延迟计算效率，验证了分布式编队算法在实时性要求较高场景下的工程可行性。'},

// ── 第九章 应用场景：编队区域覆盖 ──────────────────────────────
{type:'h1', text:'第九章  应用场景：编队区域覆盖'},
{type:'h2', text:'9.1  背景与问题'},
{type:'para', text:'在机场、仓库、医院等大型室内场所，多机器人编队协同完成区域覆盖消毒或巡视任务具有重要应用价值。覆盖路径规划（Coverage Path Planning，CPP）的目标是生成一条连续、无碰撞且能完整覆盖目标区域的路径，其效率直接影响任务完成时间与能耗。当目标区域形状复杂或存在障碍物时，需先将自由空间分解为子区域，再规划覆盖路径，最后确定子区域的遍历次序，三个环节相互耦合。'},
{type:'para', text:'现有方法存在共同局限：启发式方法不能保证完全覆盖；经典Boustrophedon分解在相邻单元转移时易产生路径重叠；基于邻接图的覆盖次序问题本质上归结为NP完全的旅行商问题（TSP）；Reeb图方法的边复制操作会在环境中部产生大量转向；遗传算法等近似求解虽能降低计算时间，但仍存在解质量不稳定的问题。'},

{type:'h2', text:'9.2  Voronoi-Boustrophedon分解与覆盖代价'},
{type:'para', text:'项目采用Voronoi图与Boustrophedon分解相结合的空间分解策略：先对自由空间进行Voronoi初始划分，得到若干主单元；再对每个主单元执行Boustrophedon分解，确定覆盖条纹方向；在每个关键点处引入3个过渡单元，消除子区域间的路径重叠问题。'},
{type:'para', text:'综合覆盖代价函数 $J_{\\text{cov}}$ 包含三个加权项：队形调整代价 $J_{\\text{adj}}$（衡量编队形状调整的能耗）、覆盖重叠代价 $J_{\\text{overlap}}$（衡量重复覆盖的浪费）和碰撞代价 $J_{\\text{col}}$（衡量碰撞风险），其带时变权重的综合优化目标为：'},
{type:'formula', latex:'J_{\\text{total}}=w_{\\text{adj}}(t)\\cdot J_{\\text{adj}}+w_{\\text{overlap}}(t)\\cdot J_{\\text{overlap}}+w_{\\text{col}}(t)\\cdot J_{\\text{col}}+w_{\\text{cover}}(t)\\cdot J_{\\text{cover}}', num:'(17)'},
{type:'para', text:'其中时变权重 $w_{\\cdot}(t)$ 反映了任务不同阶段的优先级调整。覆盖次序问题通过构建有权图 $G=(V,E,w)$ 建模为乡村邮递员问题（Rural Postman Problem，RPP），并分别采用双深度Q网络（Double DQN）强化学习方法和基于遗传算法的近似求解方案进行优化求解。'},

{type:'h2', text:'9.3  遗留挑战与展望'},
{type:'para', text:'当前方案在子区域数量较少时能给出较好的近似最优覆盖序列，但随着胞元数量增加，遗传算法和Double DQN均无法保证全局最优，搜索空间急剧扩大导致计算效率下降。核心遗留问题有两个：（1）在任意起止胞元条件下，如何在多项式时间内计算全局最优覆盖序列；（2）多机器人（$N>1$）场景下如何将覆盖序列最优分配给各机器人，以最小化总完成时间。未来研究将探索基于整数线性规划（ILP）的精确算法、多机器人协同任务分配，以及面向动态障碍物的在线重规划策略。'},

// ── 第十章 总结 ──────────────────────────────────────────────
{type:'h1', text:'第十章  总  结'},
{type:'para', text:'本项目围绕多机器人系统在障碍物复杂环境中的编队导航问题，构建了一套从感知到控制、从集中式到分布式的完整技术体系，主要成果如下：'},
{type:'para', text:'在路径规划层面，通过在A*代价函数中引入与障碍物距离相关的安全权重，生成了安全裕度更大的全局路径；以局部自由空间为核心约束，将编队保持问题统一纳入凸优化框架，设计了基于投影的高效迭代算法。'},
{type:'para', text:'在编队控制层面，基于形状理论将编队形状约束线性化，分别实现了集中式和分布式两套投影最优编队算法；分布式方案通过局部估计器和拉普拉斯一致性约束消除了对全局广播的依赖，通信量随机器人数量的增长得到有效控制；此外，罚函数方法作为工程实现的补充方案，在处理多目标、多约束队形优化问题时表现出良好的鲁棒性。'},
{type:'para', text:'在感知与验证层面，开发了激光雷达点云处理与实时局部自由空间计算模块，将传感器数据转化为可供优化算法直接利用的凸安全区域；引入RVO构建内外分层避碰体系；通过Python数值仿真和ROS/Gazebo物理仿真对完整系统进行了验证，算法以约12毫秒/步的效率成功引导机器人通过多个狭窄通道，编队约束残差收敛至机器精度。'},
{type:'para', text:'在应用拓展层面，初步探索了编队在区域覆盖任务中的应用，提出了Voronoi-Boustrophedon分解与综合代价函数的覆盖规划框架。未来工作将聚焦于：分布式算法的硬件真机验证、覆盖序列最优化问题的精确求解、以及面向动态障碍物和实时地图更新的在线重规划能力的扩展。'},

  let html = '';

  for (const item of CONTENT) {
    switch(item.type) {
      case 'h0':
        html += `<div class="dh1" contenteditable="true">${esc(item.text)}</div>`;
        break;
      case 'h1':
        html += `<div class="dh1" contenteditable="true">${esc(item.text)}</div>`;
        break;
      case 'h2':
        html += `<div class="dh2" contenteditable="true">${esc(item.text)}</div>`;
        break;
      case 'h3':
        html += `<div class="dh3" contenteditable="true">${esc(item.text)}</div>`;
        break;
      case 'para':
        html += `<div class="dp" contenteditable="true">${esc(item.text)}</div>`;
        break;
      case 'kw':
        html += `<div class="dkw" contenteditable="true">${esc(item.text)}</div>`;
        break;
      case 'formula': {
        const num = item.num || '';
        html += `<div class="df-wrap">
          <div class="df-inner" data-latex="${escAttr(item.latex)}">
            <span class="math-block">\\[${item.latex}\\]</span>
          </div>
          ${num ? `<span class="df-num">${esc(num)}</span>` : ''}
        </div>`;
        break;
      }
      case 'refs':
        for (const ref of item.items) {
          html += `<div class="dref" contenteditable="true">${esc(ref)}</div>`;
        }
        break;
      case 'img': {
        const cap = item.caption ? `<figcaption>${esc(item.caption)}</figcaption>` : '';
        const style = item.width ? ` style="max-width:${item.width}"` : '';
        html += `<figure class="df-figure">
          <img src="${item.src}"${style} alt="${escAttr(item.caption || '')}">
          ${cap}
        </figure>`;
        break;
      }
    }
  }

  container.innerHTML = html;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return s.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ============================================================
   STYLE APPLICATION (live)
   ============================================================ */
function applyStyles() {
  const pg = document.getElementById('document-page');
  const set = (k,v) => pg.style.setProperty(k, v);

  set('--body-font',  document.getElementById('s-bfont').value);
  set('--body-size',  document.getElementById('s-bsize').value);
  set('--body-lh',    document.getElementById('s-blh').value);
  set('--h1-font',    document.getElementById('s-h1font').value);
  set('--h1-size',    document.getElementById('s-h1size').value);
  set('--h1-align',   document.getElementById('s-h1align').value);
  set('--h2-font',    document.getElementById('s-h2font').value);
  set('--h2-size',    document.getElementById('s-h2size').value);
  set('--h2-align',   document.getElementById('s-h2align').value);
  set('--h3-size',    document.getElementById('s-h3size').value);
  set('--h3-align',   document.getElementById('s-h3align').value);
}

function loadTemplate(el) {
  document.querySelectorAll('.tpl').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
  const t = TEMPLATES[el.dataset.tpl];
  if (!t) return;
  setSelect('s-bfont',  t.bfont);
  setSelect('s-bsize',  t.bsize);
  setSelect('s-blh',    t.blh);
  setSelect('s-h1font', t.h1font);
  setSelect('s-h1size', t.h1size);
  setSelect('s-h1align',t.h1align);
  setSelect('s-h2font', t.h2font);
  setSelect('s-h2size', t.h2size);
  setSelect('s-h2align',t.h2align);
  setSelect('s-h3size', t.h3size);
  setSelect('s-h3align',t.h3align);
  applyStyles();
}

function setSelect(id, val) {
  const el = document.getElementById(id);
  for (const opt of el.options) {
    if (opt.value === val) { el.value = val; return; }
  }
  // If exact match not found, add and select
  const opt = document.createElement('option');
  opt.value = val; opt.textContent = val;
  el.appendChild(opt);
  el.value = val;
}

/* ============================================================
   NOTIFICATION
   ============================================================ */
let notifTimer = null;
function notify(msg, duration=2500) {
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(notifTimer);
  notifTimer = setTimeout(()=>el.classList.remove('show'), duration);
}

/* ============================================================
   DOCX EXPORT  –  uses docx.js with Math equation objects
   Formulas are rendered as proper Word equation (OMML) objects
   via docx.js Math API
   ============================================================ */
async function exportToDocx() {
  notify('⏳ 正在生成 DOCX（含Word公式）…', 12000);
  await new Promise(r=>setTimeout(r, 50));

  // ── wait up to 15 s for docx.js and FileSaver to load ──
  const waitLib = (check, label, ms=15000) => new Promise((res, rej) => {
    if (check()) { res(); return; }
    const start = Date.now();
    const t = setInterval(() => {
      if (check()) { clearInterval(t); res(); }
      else if (Date.now()-start > ms) {
        clearInterval(t);
        rej(new Error(`${label} 加载超时，请检查网络连接后刷新页面重试`));
      }
    }, 200);
  });

  try {
    await waitLib(
      () => !!(window.docx && window.docx.Document),
      'docx.js'
    );
    await waitLib(
      () => typeof saveAs === 'function',
      'FileSaver'
    );
  } catch(waitErr) {
    notify('❌ ' + waitErr.message, 8000);
    return;
  }

  try {
    const D = window.docx;

    // ── current style settings ──
    const bodyFontName = getDocxFontName(document.getElementById('s-bfont').value);
    const bodySize     = ptToHalfPt(document.getElementById('s-bsize').value);
    const bodyLh       = parseFloat(document.getElementById('s-blh').value);
    const h1FontName   = getDocxFontName(document.getElementById('s-h1font').value);
    const h1Size       = ptToHalfPt(document.getElementById('s-h1size').value);
    const h1Align      = document.getElementById('s-h1align').value === 'center'
                           ? D.AlignmentType.CENTER : D.AlignmentType.LEFT;
    const h2FontName   = getDocxFontName(document.getElementById('s-h2font').value);
    const h2Size       = ptToHalfPt(document.getElementById('s-h2size').value);
    const h2Align      = document.getElementById('s-h2align').value === 'center'
                           ? D.AlignmentType.CENTER : D.AlignmentType.LEFT;

    // Line spacing in twips (1pt = 20 twips)
    const bodyLhTwips  = Math.round(bodyLh * bodySize/2 * 20);

    function bodyPPr(indent2em) {
      return {
        spacing: { line: bodyLhTwips, lineRule: D.LineRuleType ? D.LineRuleType.AUTO : 'auto' },
        indent: indent2em ? { firstLine: bodySize * 20 } : undefined
      };
    }

    // ── paragraph factories ──
    function mkPara(text) {
      return new D.Paragraph({
        children: [new D.TextRun({ text, font: bodyFontName, size: bodySize })],
        spacing: { line: bodyLhTwips },
        indent: { firstLine: bodySize * 20 }
      });
    }

    function mkH1(text, breakPage = false) {
      return new D.Paragraph({
        children: [new D.TextRun({ text, font: h1FontName, size: h1Size, bold: true })],
        alignment: h1Align,
        spacing: { before: 480, after: 240 },
        ...(breakPage ? { pageBreakBefore: true } : {})
      });
    }

    function mkH2(text) {
      return new D.Paragraph({
        children: [new D.TextRun({ text, font: h2FontName, size: h2Size, bold: true })],
        alignment: h2Align,
        spacing: { before: 280, after: 120 }
      });
    }

    function mkRef(text) {
      return new D.Paragraph({
        children: [new D.TextRun({ text, font: bodyFontName, size: bodySize })],
        spacing: { line: bodyLhTwips },
        indent: { left: bodySize * 20, hanging: bodySize * 20 }
      });
    }

    // ── LaTeX → OMML conversion via KaTeX MathML ──────────────

    // Map KaTeX accent characters → OMML combining characters
    const ACCENT_MAP = {
      '\u007e': '\u0303', // ~ tilde           → U+0303 COMBINING TILDE
      '\u005e': '\u0302', // ^ circumflex       → U+0302 COMBINING CIRCUMFLEX ACCENT
      '\u02c9': '\u0304', // ˉ modifier macron  → U+0304 COMBINING MACRON
      '\u00af': '\u0304', // ¯ macron           → U+0304
      '\u0305': '\u0305', // combining overline → keep as-is
      '\u02d9': '\u0307', // ˙ dot above        → U+0307 COMBINING DOT ABOVE
      '\u00a8': '\u0308', // ¨ diaeresis        → U+0308 COMBINING DIAERESIS
      '\u0060': '\u0300', // ` grave            → U+0300 COMBINING GRAVE ACCENT
      '\u00b4': '\u0301', // ´ acute            → U+0301 COMBINING ACUTE ACCENT
      '\u02d8': '\u0306', // ˘ breve            → U+0306 COMBINING BREVE
      '\u02c7': '\u030c', // ˇ caron            → U+030C COMBINING CARON
      '\u2192': '\u20d7', // → right arrow      → U+20D7 COMBINING RIGHT ARROW ABOVE
      '\u20d7': '\u20d7', // combining arrow    → keep as-is
    };

    /** True when an element node is a fence <mo> (from \left, \right, \middle). */
    function isFenceMo(el) {
      if (!el || el.nodeType !== Node.ELEMENT_NODE) return false;
      const tag = el.tagName.toLowerCase().replace(/^[a-z0-9]+:/, '');
      return tag === 'mo' && el.getAttribute('fence') === 'true';
    }

    /** All childNodes of `parent` strictly between `startEl` and `endEl`. */
    function nodesBetween(parent, startEl, endEl) {
      const all = Array.from(parent.childNodes);
      const a = all.indexOf(startEl), b = all.indexOf(endEl);
      return (a >= 0 && b > a) ? all.slice(a + 1, b) : [];
    }

    /**
     * Build an OMML accent element <m:acc> for a KaTeX <mover accent="true"> node.
     * Uses D.XmlComponent + D.MathAccentCharacter + D.MathBase (all exported by docx 8.x).
     */
    function buildAccent(accentChar, baseChildren) {
      try {
        const ommlChar = ACCENT_MAP[accentChar] || accentChar;
        const acc   = new D.XmlComponent('m:acc');
        const accPr = new D.XmlComponent('m:accPr');
        // U+0302 (^) is the OMML default accent per ECMA-376 §22.1.2.5 (m:accPr/m:chr)
        // — omit chr element to keep the default (hat) so Word renders it correctly
        if (ommlChar !== '\u0302') {
          accPr.root.push(new D.MathAccentCharacter(ommlChar));
        }
        if (accPr.root.length) acc.root.push(accPr);
        acc.root.push(new D.MathBase(baseChildren));
        return acc;
      } catch(e) {
        console.warn('buildAccent failed, falling back to superscript:', e);
        return new D.MathSuperScript({ children: baseChildren, superScript: [new D.MathRun(accentChar)] });
      }
    }

    /**
     * Build an OMML <m:d> delimiter element.
     * `parts` is an array of OMML-element arrays (one per separator-delimited section).
     * OMML defaults: begChr=(  endChr=)  sepChr=|
     */
    function mkDelimiter(begChar, sepChar, endChar, parts) {
      // Use docx.js bracket classes for common single-part cases (no separator)
      if (parts.length === 1 && sepChar === null) {
        const c = parts[0];
        if (begChar === '(' && endChar === ')') return new D.MathRoundBrackets({ children: c });
        if (begChar === '[' && endChar === ']') return new D.MathSquareBrackets({ children: c });
        if (begChar === '{' && endChar === '}') return new D.MathCurlyBrackets({ children: c });
      }

      // General case: build raw <m:d> with explicit dPr
      const d   = new D.XmlComponent('m:d');
      const dPr = new D.XmlComponent('m:dPr');

      if (begChar !== '(') {
        const e = new D.XmlComponent('m:begChr');
        e.root.push({ _attr: { 'm:val': begChar } });
        dPr.root.push(e);
      }
      if (sepChar !== null && sepChar !== '|') {
        const e = new D.XmlComponent('m:sepChr');
        e.root.push({ _attr: { 'm:val': sepChar } });
        dPr.root.push(e);
      }
      if (endChar !== ')') {
        const e = new D.XmlComponent('m:endChr');
        e.root.push({ _attr: { 'm:val': endChar } });
        dPr.root.push(e);
      }
      if (dPr.root.length) d.root.push(dPr);
      for (const p of parts) d.root.push(new D.MathBase(p));
      return d;
    }

    /**
     * Build an OMML <m:eqArr> equation-array element.
     * `rowContents` is an array of OMML-element arrays, one per row.
     * Used for \begin{cases}, \begin{aligned}, \begin{align}, etc.
     */
    function buildEqArr(rowContents) {
      const eqArr = new D.XmlComponent('m:eqArr');
      for (const rowContent of rowContents) {
        const e = new D.XmlComponent('m:e');
        e.root.push(...rowContent);
        eqArr.root.push(e);
      }
      return eqArr;
    }

    /**
     * Build an OMML <m:m> matrix element.
     * `rows2d` is an array of rows; each row is an array of cell OMML-element arrays.
     * Used for \begin{pmatrix}, \begin{bmatrix}, etc. (multi-column tables inside fences).
     */
    function buildMatrix(rows2d) {
      const m = new D.XmlComponent('m:m');
      for (const cells of rows2d) {
        const mr = new D.XmlComponent('m:mr');
        for (const cell of cells) {
          const e = new D.XmlComponent('m:e');
          e.root.push(...cell);
          mr.root.push(e);
        }
        m.root.push(mr);
      }
      return m;
    }

    /**
     * Detect fenced <mrow> (from \left...\right) and build a proper OMML delimiter.
     * Returns null if the mrow is not a fenced expression.
     */
    function tryFencedMrow(node) {
      const childEls = Array.from(node.children);
      if (childEls.length < 2) return null;
      if (!isFenceMo(childEls[0]) || !isFenceMo(childEls[childEls.length - 1])) return null;

      const begChar = childEls[0].textContent;
      const endChar = childEls[childEls.length - 1].textContent;

      // Middle fence elements (from \middle) become separators
      const innerEls = childEls.slice(1, -1);
      const middleFences = innerEls.filter(isFenceMo);
      const innerNodes  = nodesBetween(node, childEls[0], childEls[childEls.length - 1]);

      if (middleFences.length === 0) {
        // Detect single inner <mtable> → route to eqArr or matrix
        const innerEls = innerNodes.filter(n => n.nodeType === Node.ELEMENT_NODE);
        if (innerEls.length === 1) {
          const innerTag = innerEls[0].tagName.toLowerCase().replace(/^[a-z0-9]+:/, '');
          if (innerTag === 'mtable') {
            const mtbl = innerEls[0];
            // Convert each <mtd> cell to OMML
            const rows2d = Array.from(mtbl.children).map(mtr =>
              Array.from(mtr.children).map(mtd => {
                const out = [];
                for (const c of mtd.childNodes) out.push(...mathmlNodeToOmml(c));
                return out;
              })
            );
            const maxCols = rows2d.length > 0 ? Math.max(...rows2d.map(r => r.length)) : 1;
            // Multi-column table inside ( or [ → proper OMML matrix
            const isMatrixFence = '(['.includes(begChar) && '([)\\u2016'.includes(endChar);
            if (maxCols > 1 && isMatrixFence) {
              return mkDelimiter(begChar, null, endChar, [[buildMatrix(rows2d)]]);
            } else {
              // cases / aligned / etc. → eqArr inside delimiter
              const rowContents = rows2d.map(r => r.flat());
              return mkDelimiter(begChar, null, endChar, [[buildEqArr(rowContents)]]);
            }
          }
        }
        // No special table: standard content inside delimiter
        const content = innerNodes.flatMap(n => mathmlNodeToOmml(n));
        return mkDelimiter(begChar, null, endChar, [content]);
      }

      // Split inner content at each middle fence
      const parts = [];
      let current = [];
      for (const n of innerNodes) {
        if (n.nodeType === Node.ELEMENT_NODE && isFenceMo(n) && middleFences.includes(n)) {
          parts.push(current);
          current = [];
        } else {
          current.push(...mathmlNodeToOmml(n));
        }
      }
      parts.push(current);

      const sepChar = middleFences[0].textContent;
      return mkDelimiter(begChar, sepChar, endChar, parts);
    }

    /**
     * Recursively convert a MathML DOM node to an array of docx OMML elements.
     */
    function mathmlNodeToOmml(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        const text = node.textContent;
        if (!text.trim()) return [];
        return [new D.MathRun(text)];
      }
      if (node.nodeType !== Node.ELEMENT_NODE) return [];

      // Strip namespace prefix (e.g. "m:mrow" → "mrow")
      const tag = node.tagName.toLowerCase().replace(/^[a-z0-9]+:/, '');

      const childOmml = (el) => {
        const out = [];
        for (const c of el.childNodes) out.push(...mathmlNodeToOmml(c));
        return out;
      };
      const nth = (n) => node.children[n] ? childOmml(node.children[n]) : [];

      switch (tag) {
        case 'math':
        case 'mstyle':
        case 'mpadded':
        case 'merror':
        case 'mphantom':
          return childOmml(node);

        case 'mrow': {
          const fenced = tryFencedMrow(node);
          if (fenced) return [fenced];
          return childOmml(node);
        }

        case 'mfenced': {
          // Handle deprecated <mfenced> (not produced by KaTeX 0.16 but may appear elsewhere)
          const open = node.getAttribute('open') ?? '(';
          const close = node.getAttribute('close') ?? ')';
          const seps  = node.getAttribute('separators') ?? ',';
          const sep   = seps[0] ?? null;
          return [mkDelimiter(open, sep, close, [childOmml(node)])];
        }

        case 'semantics':
          // Delegate to mathmlNodeToOmml (not childOmml) so that mrow/fence detection runs
          return node.children[0] ? mathmlNodeToOmml(node.children[0]) : [];

        case 'annotation':
        case 'annotation-xml':
          return [];

        case 'mi':
        case 'mn':
        case 'mo':
        case 'mtext':
          return node.textContent ? [new D.MathRun(node.textContent)] : [];

        case 'mspace':
          return [new D.MathRun('\u00a0')];

        case 'mfrac':
          return [new D.MathFraction({ numerator: nth(0), denominator: nth(1) })];

        case 'msqrt':
          try { return [new D.MathRadical({ children: childOmml(node) })] }
          catch(e) { return [new D.MathRun('√('), ...childOmml(node), new D.MathRun(')')]; }

        case 'mroot':
          try { return [new D.MathRadical({ children: nth(0), degree: nth(1) })]; }
          catch(e) { return [...nth(1), new D.MathRun('√('), ...nth(0), new D.MathRun(')')]; }

        case 'msub':
          return [new D.MathSubScript({ children: nth(0), subScript: nth(1) })];

        case 'msup':
          return [new D.MathSuperScript({ children: nth(0), superScript: nth(1) })];

        case 'msubsup':
          return [new D.MathSubSuperScript({ children: nth(0), subScript: nth(1), superScript: nth(2) })];

        case 'mover': {
          // accent="true" marks diacritic accents (\widetilde, \hat, \bar, …)
          if (node.getAttribute('accent') === 'true') {
            const accentChar = node.children[1]?.textContent ?? '';
            return [buildAccent(accentChar, nth(0))];
          }
          // Non-accent mover: treat as superscript (limit notation, etc.)
          return [new D.MathSuperScript({ children: nth(0), superScript: nth(1) })];
        }

        case 'munder': {
          if (node.getAttribute('accentunder') === 'true') {
            // Underaccent — approximate as subscript
            return [new D.MathSubScript({ children: nth(0), subScript: nth(1) })];
          }
          return [new D.MathSubScript({ children: nth(0), subScript: nth(1) })];
        }

        case 'munderover':
          return [new D.MathSubSuperScript({ children: nth(0), subScript: nth(1), superScript: nth(2) })];

        case 'mtable': {
          // Standalone <mtable> (e.g. \begin{aligned}, \begin{align}, \begin{gather}).
          // Tables inside fences (\begin{cases}, \begin{pmatrix}, etc.) are handled
          // in tryFencedMrow before this code is reached.
          const rows2d = Array.from(node.children).map(mtr =>
            Array.from(mtr.children).map(mtd => {
              const out = [];
              for (const c of mtd.childNodes) out.push(...mathmlNodeToOmml(c));
              return out;
            })
          );
          if (rows2d.length === 0) return [];
          // Concatenate cells within each row (handles multi-column align environments)
          const rowContents = rows2d.map(r => r.flat());
          return [buildEqArr(rowContents)];
        }

        case 'mtr':
        case 'mtd':
        case 'mlabeledtr':
        case 'menclose':
        case 'mmultiscripts':
        default:
          return childOmml(node);
      }
    }

    /**
     * Convert a LaTeX string to an array of docx OMML math elements.
     * Uses KaTeX for reliable parsing; falls back to a plain MathRun if KaTeX is unavailable.
     */
    function latexToOmml(latex) {
      try {
        if (!window.katex) return [new D.MathRun(latex)];
        const html = katex.renderToString(latex, { output: 'mathml', throwOnError: false });
        const div = document.createElement('div');
        div.innerHTML = html;
        const mathEl = div.querySelector('math');
        if (!mathEl) return [new D.MathRun(latex)];
        return mathmlNodeToOmml(mathEl);
      } catch(e) {
        console.warn('latexToOmml failed:', latex, e);
        return [new D.MathRun(latex)];
      }
    }

    function mathPara(mathChildren, num) {
      const children = [new D.Math({ children: mathChildren })];
      if (num) {
        children.push(new D.TextRun({ text: '      ' + num, font: bodyFontName, size: bodySize }));
      }
      return new D.Paragraph({
        children,
        alignment: D.AlignmentType.CENTER,
        spacing: { before: 180, after: 180 }
      });
    }

    /** Build a centred display-math paragraph from a LaTeX string. */
    function buildMathForLatex(latex, num) {
      return mathPara(latexToOmml(latex), num);
    }

    /**
     * Split a paragraph text string into alternating plain-text / inline-math segments.
     * Handles $$...$$ (display, treated as inline) and $...$ markers.
     */
    function parseMathSegments(text) {
      const segs = [];
      let i = 0;
      while (i < text.length) {
        if (text[i] === '$' && text[i + 1] === '$') {
          const end = text.indexOf('$$', i + 2);
          if (end !== -1) { segs.push({ math: true, s: text.slice(i + 2, end) }); i = end + 2; continue; }
        }
        if (text[i] === '$') {
          const end = text.indexOf('$', i + 1);
          if (end !== -1) { segs.push({ math: true, s: text.slice(i + 1, end) }); i = end + 1; continue; }
        }
        const next$ = text.indexOf('$', i);
        const chunk = next$ === -1 ? text.slice(i) : text.slice(i, next$);
        if (chunk) segs.push({ math: false, s: chunk });
        if (next$ === -1) break;
        i = next$;
      }
      return segs;
    }

    /**
     * Build a body paragraph whose text may contain inline LaTeX ($...$).
     * Math spans are converted to Word OMML; plain text becomes TextRun.
     */
    function mkParaWithMath(text) {
      const segs = parseMathSegments(text);
      const children = [];
      for (const seg of segs) {
        if (seg.math) {
          const omml = latexToOmml(seg.s);
          if (omml.length) children.push(new D.Math({ children: omml }));
        } else {
          if (seg.s) children.push(new D.TextRun({ text: seg.s, font: bodyFontName, size: bodySize }));
        }
      }
      return new D.Paragraph({
        children,
        spacing: { line: bodyLhTwips },
        indent: { firstLine: bodySize * 20 }
      });
    }

    /**
     * Convert a base64 data-URL (data:image/...;base64,...) or plain base64 string
     * to a Uint8Array suitable for docx.js ImageRun.
     */
    function b64ToUint8(b64src) {
      const b64 = b64src.includes(',') ? b64src.split(',')[1] : b64src;
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    /**
     * Build a centred paragraph containing an image from a data-URL.
     * widthPt / heightPt are in points (1pt = 12700 EMU in docx.js).
     * caption is an optional string placed below the image.
     */
    function buildImagePara(src, widthPt, heightPt, caption) {
      const imgData = b64ToUint8(src);
      const imageRun = new D.ImageRun({
        data: imgData,
        transformation: { width: widthPt, height: heightPt }
      });
      const imgPara = new D.Paragraph({
        children: [imageRun],
        alignment: D.AlignmentType.CENTER,
        spacing: { before: 120, after: caption ? 60 : 180 }
      });
      if (!caption) return [imgPara];
      const capPara = new D.Paragraph({
        children: [new D.TextRun({ text: caption, font: bodyFontName, size: bodySize, italics: true })],
        alignment: D.AlignmentType.CENTER,
        spacing: { after: 180 }
      });
      return [imgPara, capPara];
    }

    // ── traverse DOM to build docx children ──
    const docChildren = [];

    // Cover / title page header
    docChildren.push(new D.Paragraph({
      children: [new D.TextRun({ text: '东南大学本科生创新训练计划项目', font: bodyFontName, size: bodySize })],
      alignment: D.AlignmentType.CENTER,
      spacing: { before: 0, after: 480 }
    }));
    docChildren.push(new D.Paragraph({
      children: [new D.TextRun({ text: '结  题  报  告', font: h1FontName, size: h1Size * 2, bold: true })],
      alignment: D.AlignmentType.CENTER,
      spacing: { after: 480 }
    }));
    docChildren.push(new D.Paragraph({
      children: [new D.TextRun({ text: '项目名称：多机器人系统最优编队导航研究', font: bodyFontName, size: bodySize })],
      spacing: { after: 120 }
    }));
    docChildren.push(new D.Paragraph({
      children: [new D.TextRun({ text: '所属学院：数学学院', font: bodyFontName, size: bodySize })],
      spacing: { after: 120 }
    }));
    docChildren.push(new D.Paragraph({
      children: [new D.TextRun({ text: '指导教师：刘庆山', font: bodyFontName, size: bodySize })],
      spacing: { after: 480 }
    }));

    // Content paragraphs
    for (const item of CONTENT) {
      switch(item.type) {
        case 'h0':
          docChildren.push(new D.Paragraph({
            children: [new D.TextRun({ text: item.text, font: h1FontName, size: h1Size, bold: true })],
            alignment: D.AlignmentType.CENTER,
            spacing: { before: 480, after: 240 }
          }));
          break;
        case 'h1':
          docChildren.push(mkH1(item.text, item.text === '参考文献'));
          break;
        case 'h2':
          docChildren.push(mkH2(item.text));
          break;
        case 'h3':
          docChildren.push(new D.Paragraph({
            children: [new D.TextRun({ text: item.text, font: bodyFontName, size: bodySize, bold: true })],
            spacing: { before: 200, after: 80 }
          }));
          break;
        case 'para':
          docChildren.push(mkParaWithMath(item.text));
          break;
        case 'kw':
          docChildren.push(new D.Paragraph({
            children: [new D.TextRun({ text: item.text, font: bodyFontName, size: bodySize })],
            spacing: { line: bodyLhTwips, before: 160 }
          }));
          break;
        case 'formula':
          docChildren.push(buildMathForLatex(item.latex, item.num || ''));
          break;
        case 'refs':
          for (const ref of item.items) {
            docChildren.push(mkRef(ref));
          }
          break;
        case 'img': {
          // img item: { type:'img', src: 'data:image/jpeg;base64,...', caption:'...', widthPt:440, heightPt:330 }
          const wPt = item.widthPt || 400;
          const hPt = item.heightPt || Math.round(wPt * 0.75);
          const paras = buildImagePara(item.src, wPt, hPt, item.caption || '');
          docChildren.push(...paras);
          break;
        }
      }
    }

    // ── build Document ──
    const doc = new D.Document({
      styles: {
        paragraphStyles: []
      },
      sections: [{
        properties: {
          page: {
            margin: {
              top: 1134,   // 2cm = 1133.86 twips
              bottom: 1134,
              left: 1417,  // 2.5cm (2cm + 0.5cm gutter)
              right: 1134,
              gutter: 284  // 0.5cm
            }
          }
        },
        headers: {
          default: new D.Header({
            children: [new D.Paragraph({
              children: [new D.TextRun({ text: '东南大学本科生创新训练计划项目', font: bodyFontName, size: 18 })],
              alignment: D.AlignmentType.CENTER,
              border: { bottom: { style: D.BorderStyle.SINGLE, size: 6, color: '999999', space: 1 } }
            })]
          })
        },
        children: docChildren
      }]
    });

    const blob = await D.Packer.toBlob(doc);
    saveAs(blob, '结项报告.docx');
    notify('✅ DOCX 下载成功！', 3000);

  } catch(err) {
    console.error('DOCX export error:', err);
    notify('❌ DOCX 生成失败：' + err.message, 5000);
  }
}

/** Convert CSS pt value string to half-points integer (docx unit) */
function ptToHalfPt(ptStr) {
  return Math.round(parseFloat(ptStr) * 2);
}

/** Extract the first font family name from a CSS font-family string */
function getDocxFontName(cssFontFamily) {
  const first = cssFontFamily.split(',')[0].trim().replace(/'/g,'').replace(/"/g,'');
  return first;
}

/** Strip LaTeX markup from inline math ($...$) for plain-text export */
function stripInlineMath(text) {
  return text
    .replace(/\$\$[^$]+\$\$/g, '[公式]')
    .replace(/\$[^$]+\$/g, s => {
      const inner = s.slice(1,-1);
      // Very rough LaTeX to unicode conversion for common symbols
      return inner
        .replace(/\\mathcal\{([A-Z])\}/g,'$1')
        .replace(/\\mathbb\{([A-Z])\}/g,'$1')
        .replace(/\\mathrm\{([^}]+)\}/g,'$1')
        .replace(/\\text\{([^}]+)\}/g,'$1')
        .replace(/\\le\b/g,'≤').replace(/\\ge\b/g,'≥')
        .replace(/\\neq\b/g,'≠').replace(/\\approx\b/g,'≈')
        .replace(/\\in\b/g,'∈').replace(/\\notin\b/g,'∉')
        .replace(/\\subset/g,'⊂').replace(/\\cup/g,'∪').replace(/\\cap/g,'∩')
        .replace(/\\infty/g,'∞').replace(/\\pm/g,'±')
        .replace(/\\alpha/g,'α').replace(/\\beta/g,'β').replace(/\\gamma/g,'γ')
        .replace(/\\delta/g,'δ').replace(/\\epsilon/g,'ε').replace(/\\varepsilon/g,'ε')
        .replace(/\\sigma/g,'σ').replace(/\\lambda/g,'λ').replace(/\\mu/g,'μ')
        .replace(/\\phi/g,'φ').replace(/\\varphi/g,'φ').replace(/\\psi/g,'ψ')
        .replace(/\\omega/g,'ω').replace(/\\theta/g,'θ')
        .replace(/\\top/g,'ᵀ').replace(/\\cdot/g,'·')
        .replace(/\\ldots/g,'…').replace(/\\cdots/g,'…')
        .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g,'($1)/($2)')
        .replace(/\^/g,'').replace(/_/g,'').replace(/\{|\}/g,'')
        .replace(/\\/g,'').trim();
    });
}

/* ============================================================
   PDF EXPORT  –  uses html2pdf.js
   ============================================================ */
async function exportToPDF() {
  notify('⏳ 正在生成 PDF…', 10000);
  await new Promise(r=>setTimeout(r,50));

  // wait up to 15s for html2pdf
  const waitPdf = new Promise((res,rej) => {
    if (window.html2pdf) { res(); return; }
    const t0 = Date.now();
    const iv = setInterval(()=>{
      if (window.html2pdf) { clearInterval(iv); res(); }
      else if (Date.now()-t0>15000) { clearInterval(iv); rej(new Error('html2pdf.js 加载超时，请检查网络后刷新')); }
    },200);
  });
  try { await waitPdf; }
  catch(e) { notify('❌ '+e.message, 6000); return; }

  const el = document.getElementById('document-page');
  const opt = {
    margin: 0,
    filename: '结项报告.pdf',
    image: { type:'jpeg', quality:0.97 },
    html2canvas: { scale:2, useCORS:true, letterRendering:true },
    jsPDF: { unit:'mm', format:'a4', orientation:'portrait' }
  };

  html2pdf().set(opt).from(el).save()
    .then(()=>notify('✅ PDF 下载成功！', 3000))
    .catch(e=>notify('❌ PDF 生成失败：'+e.message, 5000));
}

/* ============================================================
   INIT
   ============================================================ */
function runKaTeX() {
  if (!window.renderMathInElement) return;
  renderMathInElement(document.getElementById('doc-content'), {
    delimiters: [
      { left:'$$', right:'$$', display:true },
      { left:'$',  right:'$',  display:false },
      { left:'\\[', right:'\\]', display:true },
      { left:'\\(',  right:'\\)',  display:false }
    ],
    throwOnError: false
  });
}

window.addEventListener('load', () => {
  renderContent();
  applyStyles();
  // KaTeX may already be loaded (fast CDN) or arrive later via dynamic loader
  if (window.renderMathInElement) {
    runKaTeX();
  } else {
    // will be called by the dynamic loader once auto-render lands
    window._katexCallback = runKaTeX;
  }
});
</script>
